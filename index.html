<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ton carnet de muscu et de cardio : programme, séances, chrono, archive et courbes de progression.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mova">
<title>Mova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap">
<meta name="theme-color" content="#F7F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1814" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F7F2EC; --blob1:#F1E3D8; --blob2:#E6EBE6; --blob3:#EFE5DE;
  --surface:#FFFDFB; --surface-2:#F1E9E1; --ink:#3B2F28; --ink-2:#86766A; --line:#E7DDD3;
  --accent:#8C6A57; --accent-fill:#CDB4A3; --accent-ink:#2E221B; --accent-soft:#F3E9E1;
  --lane:#617B8C; --lane-fill:#C7D4DC; --lane-ink:#1F313D; --lane-soft:#E9EFF2;
  --good:#5F7D57; --good-fill:#C6D5BD; --good-soft:#EAF0E5; --danger:#B0583F;
  --lilac:#CBB6C0; --lilac-soft:#F2E9EC; --peach:#E6C8B2; --peach-soft:#F7ECE2; --sun:#EAD8B2;
  --chart-a:#B08F7B; --chart-b:#8EA3B1;
  --shadow:0 2px 6px rgba(90,70,55,.06),0 10px 24px rgba(90,70,55,.07);
  --hero:linear-gradient(135deg,#EFE1D5 0%,#E8D8CE 45%,#DDD3CB 100%);
  --display:"Syne","Avenir Next",system-ui,sans-serif;
  --body:"Urbanist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"Urbanist",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1D1814; --blob1:#2E231C; --blob2:#1E2527; --blob3:#27211B;
    --surface:#28211C; --surface-2:#342B24; --ink:#F3EAE2; --ink-2:#BCA99A; --line:#43382F;
    --accent:#DDBFA9; --accent-fill:#CDB4A3; --accent-ink:#2B1F18; --accent-soft:#3A2E26;
    --lane:#A9C0CE; --lane-fill:#8EA3B1; --lane-ink:#152129; --lane-soft:#25313A;
    --good:#A9C49E; --good-fill:#9CB592; --good-soft:#26311F; --danger:#E3977F;
    --lilac:#8E7883; --lilac-soft:#33292E; --peach:#9C7A63; --peach-soft:#382A21; --sun:#8C7A4E;
    --chart-a:#CDB4A3; --chart-b:#8EA3B1;
    --shadow:0 2px 8px rgba(0,0,0,.35);
    --hero:linear-gradient(135deg,#3A2E26 0%,#382C27 45%,#2E2926 100%);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1D1814; --blob1:#2E231C; --blob2:#1E2527; --blob3:#27211B;
    --surface:#28211C; --surface-2:#342B24; --ink:#F3EAE2; --ink-2:#BCA99A; --line:#43382F;
    --accent:#DDBFA9; --accent-fill:#CDB4A3; --accent-ink:#2B1F18; --accent-soft:#3A2E26;
    --lane:#A9C0CE; --lane-fill:#8EA3B1; --lane-ink:#152129; --lane-soft:#25313A;
    --good:#A9C49E; --good-fill:#9CB592; --good-soft:#26311F; --danger:#E3977F;
    --lilac:#8E7883; --lilac-soft:#33292E; --peach:#9C7A63; --peach-soft:#382A21; --sun:#8C7A4E;
    --chart-a:#CDB4A3; --chart-b:#8EA3B1;
    --shadow:0 2px 8px rgba(0,0,0,.35);
    --hero:linear-gradient(135deg,#3A2E26 0%,#382C27 45%,#2E2926 100%);
}
html{height:100%;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.update{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:40;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(90,70,55,.25);width:max-content;max-width:calc(100% - 32px);font-weight:600;font-size:15px;border:2px solid var(--accent-fill)}
.update .btn{min-height:40px}
*{box-sizing:border-box}
body{background:radial-gradient(120% 60% at 0% 0%,var(--blob1),transparent 60%),radial-gradient(90% 50% at 100% 20%,var(--blob2),transparent 60%),radial-gradient(90% 60% at 30% 100%,var(--blob3),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.mark{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.status{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.status.cloud i{background:var(--good)}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2.sec{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:28px 0 10px}
h3{font-size:21px;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.num{font-variant-numeric:tabular-nums}
.lead{margin-top:6px;color:var(--ink-2);max-width:48ch}

.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.lane{background:var(--lane-fill);border-color:var(--lane-fill);color:var(--lane-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:0 10px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:14px}
.btn.icon{min-height:36px;width:36px;padding:0;border-radius:10px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.hero{background:var(--hero);border-radius:24px;padding:20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.35) 22px 26px);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero p{margin-top:8px;max-width:36ch}
.hero .row{margin-top:16px}
.hero .muted{color:var(--ink);opacity:.78}
.hero .btn:not(.primary){background:rgba(255,255,255,.55);border-color:transparent}
.hero .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.muscu{background:var(--accent-soft);color:var(--accent)}
.chip.cardio{background:var(--lane-soft);color:var(--lane)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.lilac{background:var(--lilac-soft);color:var(--ink)}
.chip.demo{border:1px dashed var(--line)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.item{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--ink-2)}
.item .meta{font-size:14px;color:var(--ink-2);grid-column:1/-1}
.item details{grid-column:1/-1;font-size:14px}
.item summary{cursor:pointer;color:var(--ink-2);font-size:13px;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"▸ "}
.item details[open] summary::before{content:"▾ "}
.item ul{margin:6px 0 0;padding-left:18px}
.item .right{text-align:right}
.big-stat{font-family:var(--display);font-size:22px;font-weight:600}
.empty{padding:18px 16px;color:var(--ink-2);font-size:14px}

/* Semaine */
.week-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.meter{display:flex;gap:6px;margin-top:14px}
.meter span{flex:1;height:10px;border-radius:5px;background:var(--surface-2)}
.meter span.on{background:var(--chart-a)}
.meter span.on.c{background:var(--chart-b)}
.plan{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.plan-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:0}
.plan-row .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.plan-row.done .dot{background:var(--good-fill);border-color:var(--good-fill);color:var(--ink)}
.plan-row.next{background:var(--accent-soft)}
.plan-row .t{font-weight:600}
.plan-row .d{font-size:13px;color:var(--ink-2)}

/* Test */
.steps{display:flex;gap:6px;margin-block:4px 18px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.steps span.on{background:var(--chart-a)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:74px}
.choice b{font-size:17px}
.choice span{font-size:13px;color:var(--ink-2)}
.choice[aria-pressed="true"]{border-color:var(--chart-a);background:var(--accent-soft)}
.choices .choice:nth-child(3n+2)[aria-pressed="true"]{border-color:var(--lilac);background:var(--lilac-soft)}
.choices .choice:nth-child(3n)[aria-pressed="true"]{border-color:var(--peach);background:var(--peach-soft)}
.counter{display:grid;grid-template-columns:1fr auto 38px auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.counter:first-child{border-top:0}
.counter .n{font-family:var(--display);font-size:26px;font-weight:600;text-align:center}
.counter .sub{font-size:13px;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--lane-fill);background:var(--lane-fill);color:var(--lane-ink)}
.test-nav{display:flex;gap:10px;margin-top:20px}
.test-nav .btn.primary{flex:1}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;resize:vertical}

/* Programme */
.prog-head{display:flex;flex-direction:column;gap:8px}
.prog-head input{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;border:0;background:transparent;padding:0;width:100%;border-bottom:2px solid var(--line)}
.prog-head input:focus{outline:none;border-color:var(--accent)}
.day{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.day > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px}
.day > header .l{display:flex;flex-direction:column;gap:4px;min-width:0}
.day .exs{display:flex;flex-direction:column}
.exl{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.exl .nm{font-weight:600}
.exl .spec{font-size:14px;color:var(--ink-2)}
.exl .spec b{color:var(--ink);font-weight:600}
.exl .nt{font-size:13px;color:var(--ink-2);font-style:italic}
.day footer{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.cardio-box{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:15px}
.ed{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ed .top-row{display:flex;gap:6px;align-items:center}
.ed .top-row input{flex:1}
.ed input,.ed select,.field input,.field select,.add-ex input{min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%}
.ed .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ed label.toggle{flex-direction:row;align-items:center;gap:10px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);min-height:40px}
.ps{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:14px;padding:10px}
.ps-row{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;align-items:center}
.ps-row.head{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);text-align:center}
.ps-row .n{font-family:var(--display);font-size:20px;font-weight:600;text-align:center;color:var(--ink-2)}
.ps-row input{text-align:center;background:var(--surface)!important}
.ps-step{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.ps-step input{width:70px!important;text-align:center;background:var(--surface)!important}
.ed label input,.ed label select,.ed label textarea{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
@media (max-width:400px){.ed .grid4{grid-template-columns:repeat(2,1fr)}.ed .grid2{grid-template-columns:1fr}}
.gen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.methods{display:flex;flex-direction:column;gap:0}
.method{padding:12px 16px;border-top:1px solid var(--line)}
.method:first-child{border-top:0}
.method .facts{display:flex;flex-wrap:wrap;gap:6px;margin-block:6px}
.method p{font-size:14px;color:var(--ink-2)}
details.card > summary{cursor:pointer;font-weight:600;list-style:none}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:" ▸";color:var(--ink-2)}
details.card[open] > summary::after{content:" ▾"}

/* Séance */
.draft-head{display:flex;flex-direction:column;gap:4px}
.draft-head input{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;border:0;background:transparent;padding:0;width:100%;border-bottom:2px solid var(--line)}
.draft-head input:focus{outline:none;border-color:var(--accent)}
.ex{background:var(--surface);border-radius:20px;padding:14px 14px 10px;box-shadow:var(--shadow)}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .target{font-size:14px;color:var(--ink-2);margin:2px 0 8px}
.ex .target b{color:var(--ink)}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;padding-block:4px}
.set-row.head{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);padding-block:0 2px;text-align:center}
.set-row .n{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;color:var(--ink-2)}
.set-row input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.set-row.done input{background:var(--good-soft);border-color:transparent}
.check{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{opacity:.35}
.set-row.done .check{background:var(--good-fill);border-color:var(--good-fill);color:var(--ink)}
.set-row.done .check svg{opacity:1}
.feel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px 42px}
.feel button{min-height:32px;padding:0 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.feel button[aria-pressed="true"][data-v="facile"]{background:var(--good-fill);border-color:var(--good-fill);color:var(--ink)}
.feel button[aria-pressed="true"][data-v="bien"]{background:var(--lane-fill);border-color:var(--lane-fill);color:var(--lane-ink)}
.feel button[aria-pressed="true"][data-v="dur"]{background:var(--peach);border-color:var(--peach);color:var(--ink)}
.feel button[aria-pressed="true"][data-v="max"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.feel input{flex:1 1 100%;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-size:16px}
.last{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--lilac-soft);font-size:14px;display:flex;flex-direction:column;gap:3px}
.last i{color:var(--ink-2)}
.advice{font-weight:600;margin-top:2px}
.advice.up{color:var(--good)}
.advice.down{color:var(--danger)}
.coach{margin:-2px 0 12px 42px;padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--lane-soft);font-size:14px;display:flex;flex-direction:column;gap:6px}
.coach b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lane)}
.coach .btn{align-self:flex-start}
.me{width:40px;height:40px;border-radius:50%;border:0;background:var(--hero);color:var(--ink);font-family:var(--display);font-size:20px;font-weight:700;display:grid;place-items:center;box-shadow:var(--shadow)}
.hello{font-family:var(--display);font-size:20px;font-weight:600;color:var(--accent);margin-bottom:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field input{background:var(--surface)}
.pick-hint{font-size:13px;color:var(--ink-2);margin-top:8px}
.choice .badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-fill);color:var(--accent-ink);padding:2px 8px;border-radius:999px;margin-top:4px}
.recap{display:flex;flex-direction:column}
.recap div{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.recap div:first-child{border-top:0}
.recap span:first-child{color:var(--ink-2);font-size:13px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.avatar-big{width:72px;height:72px;border-radius:50%;background:var(--hero);display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:700;box-shadow:var(--shadow)}
.kcal{display:flex;align-items:baseline;gap:8px}
.kcal b{font-family:var(--display);font-size:52px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro{border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}
.macro .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.macro .v small{font-size:15px;color:var(--ink-2)}
.macro .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.macro .s{font-size:12px;color:var(--ink-2)}

.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px}

.tips{display:flex;flex-direction:column}
.tip{padding:12px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}

.tip p{font-size:14px;color:var(--ink-2)}
.food{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 16px;border-top:1px solid var(--line);font-size:15px}
.food:first-child{border-top:0}
.food .q{font-size:13px;color:var(--ink-2)}
.food .pr{font-family:var(--display);font-size:20px;font-weight:600;grid-row:1/3;grid-column:2;align-self:center}

.alert:first-child{border-top:0}
.alert .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--peach-soft);color:var(--accent)}
.alert p{font-size:14px;color:var(--ink-2)}
.win{display:flex;justify-content:space-between;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line)}
.win:first-child{border-top:0}
.win b.num{color:var(--good);font-family:var(--num);font-size:20px}
.streak{display:flex;gap:6px;margin-top:10px}
.streak span{flex:1;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.streak span.ok{background:var(--good-fill);color:var(--ink)}
.streak span.part{background:var(--peach-soft);color:var(--ink)}
.squares{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sq{position:relative;min-height:180px;border:0;border-radius:24px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);color:var(--ink);min-width:0}
.sq svg{width:30px;height:30px;flex:none}
.sq b{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1;margin-top:10px}
.sq span.p{font-size:13px;line-height:1.35;color:var(--ink-2)}
.sq.s1{background:var(--peach-soft)} .sq.s2{background:var(--lilac-soft)} .sq.s3{background:var(--accent-soft)} .sq.s4{background:var(--good-soft)}
.sq .live-tag{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--accent-fill);color:var(--accent-ink);padding:3px 8px;border-radius:999px}
@media (max-width:360px){.sq b{font-size:22px}.sq span.p{font-size:12px}}
.adv-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.adv-row:first-child{border-top:0}
.adv-row .d{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.verdict{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.verdict.up{background:var(--good-fill);color:var(--ink)}
.verdict.keep{background:var(--lilac-soft);color:var(--ink);border:1.5px solid var(--lilac)}
.verdict.down{background:var(--peach);color:var(--ink)}
.advice.keep{color:var(--accent)}
.entry .fb{grid-column:2/-1;font-size:13px;color:var(--ink-2);margin-top:-2px}
.ex-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
.ex-foot .hint{font-size:13px;color:var(--ink-2);margin-left:auto}
.add-ex{display:flex;gap:8px}
.add-ex input{height:46px;background:var(--surface);border-radius:12px}
.msg{font-size:14px;color:var(--danger)}
.planned{padding:12px 14px;border-radius:16px;background:var(--lane-soft);color:var(--ink);font-size:15px}
.planned b{color:var(--lane)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.rpe button[aria-pressed="true"]{background:var(--lane-fill);border-color:var(--lane-fill);color:var(--lane-ink)}

/* Chrono */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--ink-2)}

.dial .time{font-family:var(--display);font-size:clamp(72px,24vw,112px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}

.bar{width:100%;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}

.toggle{display:flex;align-items:center;gap:10px;font-size:15px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.tiles .tile:nth-child(3),.arch-stats .tile:nth-child(3){background:var(--good-soft)}
.arch-stats .tile:nth-child(4){background:var(--accent-soft)}
.tile .v small{font-size:16px;font-weight:500;color:var(--ink-2)}
.tile .l{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.rank{display:grid;grid-template-columns:24px 32px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank img{width:32px;height:32px;border-radius:50%}
.rank .pos{font-family:var(--display);font-size:20px;font-weight:700;color:var(--ink-2);text-align:center}
.rank.me{background:var(--accent-soft)}
.rank img{background:var(--lilac-soft)}

.rest-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

.rest-pill button{white-space:nowrap;border:0;border-radius:999px;background:rgba(127,127,127,.25);color:inherit;min-height:34px;padding:0 12px;font-size:14px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr)}
.tabs button{border:0;background:transparent;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:-.01em;line-height:1.1;text-align:center;padding:0 2px;font-weight:600;color:var(--ink-2);position:relative;padding:0}
.tabs button[aria-current="page"]{color:var(--accent)}

.tabs button .live{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tabs svg{width:24px;height:24px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}

/* Liste d'exercices */

.sheet{background:var(--bg);width:100%;max-width:600px;height:calc(100% - 40px - env(safe-area-inset-top,0px));border-radius:24px 24px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(59,47,40,.25);overflow:hidden}
.sheet-head{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head .top-line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{font-size:22px}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

.cats button{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.cats button[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.pk-list{flex:1;overflow-y:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.pk-group{margin-top:14px}
.pk-group > b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px 4px}
.pk-rows{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pk-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:0 14px 0 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;font-size:16px}
.pk-rows .pk-row:first-child{border-top:0}
.pk-row .plus{flex:none;min-width:32px;height:32px;padding:0 6px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:600;line-height:1}

.pk-row.added{background:var(--good-soft)}
.add-big{border-style:dashed;border-width:2px;background:transparent;color:var(--accent)}

.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.exo-card{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent}
.exo-card:first-child{border-top:0}
.exo-card .nm{font-weight:600;font-size:17px}
.exo-card .d{font-size:13px;color:var(--ink-2)}
.exo-card svg{width:92px;height:30px;grid-row:1/3;grid-column:2}
.arch-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.entry:first-child{border-top:0}
.entry .dt{font-family:var(--display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:74px}

.gap{padding:8px 16px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--bg)}

}

function rythme(){
  const days = journal.programme?.days || [];
  const c = {}; days.forEach(d => { c[d.focus] = (c[d.focus]||0) + 1; });
  return FOCUS_ORDER.filter(f => c[f]).map(f => `${c[f]}× ${FOCUS[f]}`).join(' · ');
}
function restFor(name){
  const k = String(name).trim().toLowerCase();
  for(const d of journal.programme?.days || []) for(const e of d.exercises || []) if(e.name.trim().toLowerCase() === k && e.rest != null) return +e.rest;
  return settings.rest || 90;
}
// Durée estimée exercice par exercice : répétitions × temps d'une répétition, installation, pauses entre séries, passage à l'exercice suivant.
const HEAVY = ['squat barre','front squat','soulevé de terre','soulevé de terre roumain','rdl','développé couché','développé militaire','développé incliné','presse à cuisses','machine hack squat','hack squat','rowing barre','tractions','dips','good morning'];
const EXPLOSIVE = ['kettlebell swing','burpees','box jumps','squat sauté','squats sautés','fentes sautées','jumping jacks','mountain climbers','thrusters','wall balls','corde à sauter'];
const UNILATERAL = ['fentes bulgares','fentes arrière','fentes avant','fentes marchées','squat bulgare','step up','step up banc poulie','rowing haltère','pont fessier unilatéral','kickback à la poulie','mollets unilatéraux','fente avec rotation'];
function repInfo(name){
  const k = String(name).trim().toLowerCase();
  const sec = EXPLOSIVE.includes(k) ? 2 : HEAVY.some(h => k === h || k.startsWith(h + ' ')) ? 4 : 3;
  return {sec, sides: UNILATERAL.includes(k) ? 2 : 1, timed: TIMED.has(String(name).trim())};
}
const SET_SETUP = 10, TRANSITION = 90;
function exerciseTime(e){
  const info = repInfo(e.name), rest = e.rest != null ? +e.rest : restFor(e.name);
  const work = e.sets.reduce((a, x) => a + (info.timed ? (+x.reps || 30) : (+x.reps || 10) * info.sec) * info.sides + SET_SETUP, 0);
  const pauses = Math.max(0, e.sets.length - 1) * rest;
  return {work, pauses, rest, info, total: work + pauses};
}
function estBreakdown(s){
  const rows = (s.exercises || []).map(e => ({name:e.name, sets:e.sets.length, ...exerciseTime(e)}));
  const transitions = Math.max(0, rows.length - 1) * TRANSITION;
  return {rows, transitions, total: rows.reduce((a, r) => a + r.total, 0) + transitions};
}
function estMinutes(s){
  if(s.kind === 'cardio') return (+s.cardio?.sec || 0) / 60;
  if(s.circuit || !(s.exercises || []).length) return +s.durationMin || 0;
  return estBreakdown(s).total / 60;
}
const fmtSec = sec => { sec = Math.round(sec); const m = Math.floor(sec/60), r = sec % 60; return m ? (r ? `${m} min ${String(r).padStart(2,'0')}` : `${m} min`) : `${r} s`; };
function breakdownHTML(s){
  const b = estBreakdown(s);
  return `<details style="margin-top:8px"><summary class="small muted">Durée ${s.durSet ? 'indiquée' : 'estimée'} : ${fmtHM(effMinutes(s))} · voir le calcul</summary>
    <ul class="small muted num" style="margin:6px 0 0;padding-left:18px">${b.rows.map(r => `<li><b style="color:var(--ink)">${esc(r.name)}</b> : ${r.sets} série${r.sets > 1 ? 's' : ''} (~${fmtSec(r.work / r.sets)} chacune${r.info.sides > 1 ? ', les 2 côtés' : ''})${r.sets > 1 ? ` + ${r.sets - 1} pause${r.sets > 2 ? 's' : ''} de ${fmtSec(r.rest)}` : ''} = ${fmtSec(r.total)}</li>`).join('')}
    ${b.transitions ? `<li>Passages d’un exercice à l’autre : ${b.rows.length - 1} × 1 min 30 = ${fmtSec(b.transitions)}</li>` : ''}</ul>
    <p class="small muted" style="margin-top:4px">Repères : ~3 s par répétition (4 s sur les mouvements lourds, 2 s sur les explosifs), 10 s d’installation par série, et ton temps de repos entre les séries.${s.durSet ? ' Tu as indiqué la durée toi-même : c’est elle qui compte.' : ''}</p>
  </details>`;
}
function effMinutes(s){
  if(s.kind === 'cardio' || s.circuit || s.durSet) return Math.round(+s.durationMin || estMinutes(s));
  const est = estMinutes(s), d = +s.durationMin || 0;
  return Math.round(d >= est * 0.5 && d <= est * 2.5 ? d : est);
}
const MET = {crossfit:8, hiit:8, velo:7, rameur:7, natation:7, marche:3.5, course:9, tapis:9, autre:5};
function kcalOf(s, kg){
  kg = +kg || 65;
  if(s.kind === 'cardio'){
    const c = s.cardio || {}, km = +c.km || 0;
    if(km && (c.type === 'course' || c.type === 'tapis')) return km * kg * 1.0;
    if(km && c.type === 'marche') return km * kg * 0.55;
    return (MET[c.type] || 5) * kg * effMinutes(s) / 60;
  }
  return (s.circuit ? 8 : 5) * kg * effMinutes(s) / 60;
}
function weekStats(sessions, key){

  return {

    total: s.length,
    km: Math.round(s.reduce((a,x) => a + (+x.cardio?.km || 0), 0)*10)/10,
    minutes: Math.round(s.reduce((a,x) => a + effMinutes(x), 0))
  };
}

/* ================= Mises à jour (service worker) ================= */
const APP_VERSION = '1.6.0';
function setupUpdates(){
  if(!('serviceWorker' in navigator)) return;
  let refreshing = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if(refreshing || !hadController) return; refreshing = true; try{ sessionStorage.setItem('pf.noSplash', '1'); }catch(e){} location.reload(); });
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg => {
    let wake = Date.now();
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') wake = Date.now(); });
    const offer = w => {
      // À l'ouverture de l'appli, sans séance en cours : mise à jour automatique.
      if(!draft && !ui.test && !ui.picker && !editing() && Date.now() - wake < 15000){ w.postMessage('skipWaiting'); return; }
      const box = $('#update'); box.hidden = false;
      $('#update-btn').onclick = () => { if(draft) saveDraft(); w.postMessage('skipWaiting'); };
    };
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if(!w) return;
      w.addEventListener('statechange', () => { if(w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') check(); });
    setInterval(check, 30*60*1000);
  }).catch(() => {});
}

let actx = null, wake = null;
function unlockAudio(){
  try{ if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state === 'suspended') actx.resume(); }catch(e){}
}
function beep(freq=880, dur=.15, vol=.25){
  if(!actx) return;
  try{
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
async function keepAwake(){ try{ if('wakeLock' in navigator && !wake){ wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } }catch(e){} }
function releaseAwake(){ if(rest.running || iv.running || sw.running) return; try{ wake && wake.release(); }catch(e){} wake = null; }

/* ================= Minuteurs ================= */
const rest = {total:settings.rest, left:settings.rest, running:false, endAt:0, lastSec:null};
function restStart(sec){
  unlockAudio();
  if(sec != null){ rest.total = sec; rest.left = sec; }
  if(rest.left <= 0) rest.left = rest.total;
  rest.endAt = performance.now() + rest.left*1000; rest.running = true; rest.lastSec = null; keepAwake(); updatePill();
}
function restPause(){ if(!rest.running) return; rest.left = Math.max(0, (rest.endAt - performance.now())/1000); rest.running = false; releaseAwake(); }
function restStop(){ rest.running = false; rest.left = rest.total; releaseAwake(); updatePill(); }

const iv = Object.assign({work:40, rest:20, rounds:10, prep:10, names:[], title:''}, LS.get('pf.iv', {}), {phase:'idle', round:0, left:0, phaseLen:0, running:false, endAt:0, lastSec:null});
function ivSave(){ LS.set('pf.iv', {work:iv.work, rest:iv.rest, rounds:iv.rounds, names:iv.names, title:iv.title}); }
function ivSetPhase(p){
  iv.phase = p; iv.phaseLen = p === 'prep' ? iv.prep : p === 'work' ? iv.work : p === 'rest' ? iv.rest : 0;
  iv.left = iv.phaseLen; iv.endAt = performance.now() + iv.left*1000; iv.lastSec = null;
}
function ivStart(){
  unlockAudio();
  if(iv.phase === 'idle' || iv.phase === 'done'){ iv.round = 1; ivSetPhase('prep'); } else iv.endAt = performance.now() + iv.left*1000;
  iv.running = true; keepAwake();
}
function ivPause(){ iv.left = Math.max(0, (iv.endAt - performance.now())/1000); iv.running = false; releaseAwake(); }
function ivReset(){ iv.running = false; iv.phase = 'idle'; iv.round = 0; iv.left = 0; releaseAwake(); }
function ivAdvance(){
  if(iv.phase === 'prep'){ ivSetPhase('work'); beep(1320,.35); buzz(300); return; }
  if(iv.phase === 'work'){
    if(iv.round >= iv.rounds){ iv.phase = 'done'; iv.running = false; beep(1320,.2); setTimeout(()=>beep(1320,.2),250); setTimeout(()=>beep(1760,.5),500); buzz([300,100,300,100,600]); releaseAwake(); if(tab === 'chrono') renderView(); return; }
    if(iv.rest > 0){ ivSetPhase('rest'); beep(660,.35); buzz(200); return; }
    iv.round++; ivSetPhase('work'); beep(1320,.35); buzz(300); return;
  }
  if(iv.phase === 'rest'){ iv.round++; ivSetPhase('work'); beep(1320,.35); buzz(300); }
}
const ivName = () => iv.names.length ? iv.names[(iv.round - 1) % iv.names.length] : '';

const sw = {acc:0, start:0, running:false, laps:[]};
const swNow = () => sw.acc + (sw.running ? performance.now() - sw.start : 0);

function tick(){
  const now = performance.now();
  if(rest.running){
    rest.left = Math.max(0, (rest.endAt - now)/1000);
    const s = Math.ceil(rest.left);
    if(s !== rest.lastSec){ if(s <= 3 && s > 0) beep(880,.1); rest.lastSec = s; }
    if(rest.left <= 0){ rest.running = false; rest.left = rest.total; beep(1320,.2); setTimeout(()=>beep(1760,.4),220); buzz([200,100,400]); releaseAwake(); toast('Repos terminé : série suivante !'); if(tab === 'chrono' && chronoMode === 'repos') renderView(); }
  }
  if(iv.running){
    iv.left = Math.max(0, (iv.endAt - now)/1000);
    const s = Math.ceil(iv.left);
    if(s !== iv.lastSec){ if(s <= 3 && s > 0) beep(880,.1); iv.lastSec = s; }
    if(iv.left <= 0) ivAdvance();
  }
  updatePill(); updateDials();
}
setInterval(tick, 200);

function updatePill(){
  const pill = $('#rest-pill');
  const show = rest.running && !(tab === 'chrono' && chronoMode === 'repos');
  pill.hidden = !show;
  if(show) $('#pill-time').textContent = fmtClock(Math.ceil(rest.left));
}

    let sub = '';
    if(iv.names.length){
      if(iv.phase === 'work') sub = ivName();

  }else{

}

/* ================= Logique programme ================= */
const FEELS = {facile:'Facile', bien:'Moyen', dur:'Dur', max:'Très dur'};
function feelText(sets){
  const parts = sets.map((x,k) => x.feel || x.note ? `S${k+1} ${x.feel ? FEELS[x.feel]?.toLowerCase() || '' : ''}${x.note ? (x.feel ? ' : ' : ': ') + x.note : ''}` : '').filter(Boolean);
  return parts.join(' · ');
}
function advice(sets){
  const f = sets.map(x => x.feel).filter(Boolean);
  if(!f.length) return null;
  const n = f.length, cnt = v => f.filter(x => x === v).length;
  const top = Math.max(0, ...sets.map(x => +x.kg || 0));
  const inc = top >= 60 ? 5 : 2.5;
  if(cnt('max') >= Math.ceil(n/2)){
    return top ? {cls:'down', kind:'Baisse un peu', delta:-2.5, txt:`Trop dur : baisse un peu (−2,5 kg) pour faire toutes tes répétitions proprement.`}
               : {cls:'down', kind:'Baisse un peu', delta:0, txt:'Trop dur : fais 1 à 2 répétitions de moins par série.'};
  }
  if(cnt('max') || cnt('dur')) return {cls:'keep', kind:'Reste', delta:0, txt:'Reste sur ce poids encore une semaine.'};
  if(cnt('facile') >= Math.ceil(n/2)){
    return top ? {cls:'up', kind:'Augmente', delta:inc, txt:`C’était facile : augmente de ${fmtN(inc)} kg.`}
               : {cls:'up', kind:'Augmente', delta:0, txt:'C’était facile : ajoute 1 à 2 répétitions par série.'};
  }
  return {cls:'keep', kind:'Reste', delta:0, txt:'C’était moyen : reste sur ce poids encore une semaine, tu progresses.'};
}
function coachTip(E, k){
  const sets = E.sets, s = sets[k], next = sets[k+1];
  const kg = parseFloat(String(s.kg).replace(',','.')) || 0, reps = parseInt(s.reps) || 0;
  const f = s.feel, done = sets.slice(0, k+1).map(x => x.feel).filter(Boolean);
  const inc = kg >= 60 ? 5 : 2.5;
  const nkg = next ? parseFloat(String(next.kg).replace(',','.')) || 0 : 0;
  if(next){
    if(f === 'facile'){
      if(nkg > kg) return {txt:`Facile ! Continue, la prochaine série monte à ${fmtN(nkg)} kg.`};
      if(kg) return {txt:`Facile ! Tu peux mettre ${fmtN(kg + inc)} kg sur la prochaine série.`, act:'coach-next', kg:kg + inc, label:`Mettre ${fmtN(kg + inc)} kg`};
      return {txt:'Facile ! Ajoute 1 à 2 répétitions sur la prochaine série.'};
    }
    if(f === 'bien') return {txt: nkg ? `Bonne zone, continue comme prévu : ${fmtN(nkg)} kg.` : 'Bonne zone, continue comme prévu.'};
    if(f === 'dur'){
      if(nkg > kg) return {txt:`Dur : reste à ${fmtN(kg)} kg sur la prochaine série au lieu de ${fmtN(nkg)}.`, act:'coach-next', kg, label:`Rester à ${fmtN(kg)} kg`};
      return {txt:'Dur : garde la charge et vise les mêmes répétitions. Prends bien ton repos.'};
    }
    if(kg > 2.5) return {txt:`Très dur : baisse à ${fmtN(Math.min(nkg || kg, kg) - 2.5)} kg pour la prochaine série et fais tes répétitions proprement.`, act:'coach-next', kg:Math.min(nkg || kg, kg) - 2.5, label:`Passer à ${fmtN(Math.min(nkg || kg, kg) - 2.5)} kg`};
    return {txt:'Très dur : fais 1 à 2 répétitions de moins sur la prochaine série.'};
  }
  // Dernière série de l'exercice
  const allDone = sets.every(x => x.done);
  if(allDone && done.length && !done.some(x => x === 'dur' || x === 'max') && sets.length < 8){
    const prev = sets[k-1];
    const pkg = prev ? parseFloat(String(prev.kg).replace(',','.')) || 0 : 0, preps = prev ? parseInt(prev.reps) || 0 : 0;
    const step = kg && pkg && kg > pkg ? kg - pkg : (kg ? inc : 0);
    const r = reps && preps > reps ? Math.max(1, reps - (preps - reps)) : reps;
    const xk = kg ? kg + step : 0;
    return {txt:'Tu as encore de la marge : tente une série de plus !', act:'coach-extra', kg:xk, reps:r, label:`Ajouter ${xk ? fmtN(xk) + ' kg × ' : ''}${r || '?'}${xk ? '' : ' rép.'}`};
  }
  if(f === 'dur' || f === 'max') return {txt:'Bien joué, tu es allé chercher tes limites. Exercice terminé !'};
  return {txt:'Exercice terminé, bravo !'};
}
const PATTERNS = {prog:{label:'Charge progressive', short:'Progressive', color:'var(--chart-a)'}, fixe:{label:'Charge fixe', short:'Fixe', color:'var(--chart-b)'}};
function patternOf(sets){ return new Set(sets.map(x => +x.kg || 0).filter(v => v > 0)).size > 1 ? 'prog' : 'fixe'; }
function lastExFor(name, pat){

function buildProgramme(p){

      if(prevUsed.has(name)) sc -= 4;
      if(deb && ['Squat barre','Soulevé de terre roumain','Développé militaire','Tractions','Dips','Rowing barre'].includes(name)) sc -= 1;
      if((p.notes || '').toLowerCase().includes(name.toLowerCase())) sc += 2;

      if(prevUsed.has(name)) sc -= 4;

      if(deb && ['Squat barre','Soulevé de terre roumain','Développé militaire','Tractions','Dips','Rowing barre','Good morning','Nordic curl'].includes(name)) sc -= 1;

function trainingPerWeek(p){
  if(journal.programme?.days?.length) return journal.programme.days.length;
  if(p.days) return (+p.days || 0) + (+p.cardioN || 0);
  return Object.values(p.weekly || {}).reduce((a,b) => a + (+b || 0), 0);
}
function nutrition(p){
  const kg = +p.poids, cm = +p.taille, age = +p.age;

  const sessions = trainingPerWeek(p);
  const factor = Math.min(1.9, ({sedentaire:1.2, actif:1.35, tres:1.5}[p.quotidien] || 1.3) + Math.min(sessions, 6)*0.04);

function progressWins(){
  const idx = exerciseIndex(journal.sessions.filter(s => s.kind !== 'cardio')), since = Date.now() - 28*86400000, wins = [];
  Object.values(idx).forEach(it => ['prog','fixe'].forEach(pat => {
    const es = it.entries.filter(e => e.pat === pat && e.max > 0);
    if(es.length < 2) return;
    const last = es[es.length-1]; if(new Date(last.date).getTime() < since) return;
    const inWin = es.filter(e => new Date(e.date).getTime() >= since), before = es.filter(e => new Date(e.date).getTime() < since);
    const ref = before.length ? before[before.length-1] : inWin[0];
    const diff = last.max - ref.max; if(diff <= 0) return;
    const weeks = Math.max(1, Math.round((new Date(last.date) - new Date(ref.date)) / (7*86400000)));
    wins.push({name:it.name, pat, diff, weeks, both: es.length !== it.entries.filter(e => e.max > 0).length});
  }));
  return wins.sort((a,b) => b.diff - a.diff).slice(0, 5);
}
function watchAlerts(){

    const es = it.entries.filter(e => e.pat === pat);
    const l4 = es.slice(-4);
    const lastHard = l4.length && l4[l4.length-1].sets.some(x => x.feel === 'max');
    if(l4.length === 4 && !lastHard && l4.every(e => e.max > 0 && e.max === l4[0].max)) out.push({ic:'=', t:`${it.name} : même charge depuis 4 séances`, d:`Tu es à ${fmtN(l4[0].max)} kg. Essaie d’abord de faire 1 à 2 répétitions de plus par série, puis augmente la charge.`});
    const l3 = es.slice(-3);
    if(l3.length === 3 && l3.every(e => e.sets.some(x => x.feel === 'max'))) out.push({ic:'!', t:`${it.name} : très dur 3 fois de suite`, d:'Baisse un peu la charge pendant une semaine (environ −10 %) pour mieux récupérer, puis remonte.'});
  }));
  const names = new Set((journal.programme?.days || []).flatMap(d => (d.exercises || []).map(e => e.name.trim().toLowerCase())));
  Object.values(idx).forEach(it => {

    const last = it.entries[it.entries.length-1], days = Math.floor((now - new Date(last.date)) / 86400000);

function regularity(){

  let streak = 0;

  if(planned && weekStats(journal.sessions, weekKey(now)).total >= planned) streak++;

    <ul class="small muted" style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
      <li><b>Surtout facile, aucun dur</b> → augmente (+2,5 kg, ou +5 kg au-dessus de 60 kg).</li>
      <li><b>Surtout moyen</b>, ou <b>au moins un dur</b> → garde la même charge encore une semaine.</li>
      <li><b>La moitié des séries ou plus en très dur</b> → allège un peu (−2,5 kg).</li>
      <li><b>Même charge depuis 4 séances</b> → ajoute 1 à 2 répétitions avant d’augmenter.</li>
      <li>Tes séances en <b>charge progressive</b> et en <b>charge fixe</b> sont comparées séparément.</li>
    </ul>
  </details>`;
}

/* ---------- Semaine ---------- */
function viewSemaine(){
  if(!ui.test && !ui.skipWelcome && profileIncomplete()) ui.test = journal.profile ? newTest('complete') : newTest();
  if(ui.test) return viewTest();
  const now = new Date(), ws = weekStart(now), we = new Date(ws); we.setDate(we.getDate()+6);
  const range = `${ws.getDate()} ${ws.toLocaleDateString('fr-FR',{month:'short'})} – ${we.getDate()} ${we.toLocaleDateString('fr-FR',{month:'short'})}`;
  if(!journal.profile){
    return `<section class="hero">
      <h1>Bienvenue&nbsp;!</h1>
      <p class="muted">Dis-moi ton prénom, puis saisis ton programme ou fais le bilan pour qu’on t’en crée un.</p>
      <div class="row"><button type="button" class="btn primary" data-act="test-start">Commencer</button></div>
    </section>
    <h2 class="sec">Ce que tu trouveras ici</h2>
    <div class="list">
      <div class="item"><div><div class="t">Ta semaine en un coup d’œil</div><div class="d">Séances prévues, séances faites, et la prochaine à lancer.</div></div></div>
      <div class="item"><div><div class="t">Ton programme, à ta façon</div><div class="d">Exercices, séries, charges et temps de repos, jour par jour.</div></div></div>
      <div class="item"><div><div class="t">Le repos qui se lance tout seul</div><div class="d">Chaque exercice a son temps de repos selon ta méthode.</div></div></div>
      <div class="item"><div><div class="t">Ton archive et tes courbes</div><div class="d">Chaque charge, date par date, et ta progression par exercice.</div></div></div>
    </div>
    <p class="small muted" style="margin-top:14px">Tu préfères juste noter une séance ? <button type="button" class="btn sm ghost" data-act="go" data-tab="seance" style="padding:0;min-height:auto;color:var(--accent)">Aller à Séance</button></p>`;
  }
  const ps = planStatus();
  const next = ps.rows.find(r => !r.done);
  const g = GOALS[journal.profile.goal];
  const meter = ps.rows.map(r => `<span class="${r.done ? 'on' : ''} ${r.day.kind === 'cardio' ? 'c' : ''}"></span>`).join('');
  return `<div class="week-head">
      <div>${journal.profile.prenom ? `<p class="hello">Salut ${esc(journal.profile.prenom)} !</p>` : ''}<p class="small muted" style="text-transform:uppercase;letter-spacing:.08em">Semaine du ${range}</p><h1 class="num">${ps.done} / ${ps.planned || '–'} séances</h1></div>
      ${g ? `<span class="chip lilac">${g.label}</span>` : ''}
    </div>
    ${ps.planned ? `<div class="meter">${meter}</div>` : ''}
    ${!journal.profile.prenom ? `<div class="card row" style="margin-top:16px;justify-content:space-between"><p style="flex:1 1 180px">Ajoute ton prénom et fais ton bilan dans ton profil.</p><button type="button" class="btn sm primary" data-act="go" data-tab="profil">Mon profil</button></div>` : ''}
    ${!journal.programme ? `<div class="card stack" style="margin-top:16px"><p>Tu n’as pas encore de programme.</p><div class="row"><button type="button" class="btn primary" data-act="prog-perso">Saisir mon programme</button><button type="button" class="btn" data-act="prog-ia">Le faire créer</button></div></div>` : ''}
    ${draft ? `<div class="card row" style="margin-top:16px;justify-content:space-between"><div><div style="font-weight:600">${esc(draft.name)}</div><div class="small muted">Séance en cours</div></div><button type="button" class="btn primary" data-act="go" data-tab="seance">Reprendre</button></div>`
      : next ? `<div class="hero" style="margin-top:16px"><p class="small muted" style="margin:0;text-transform:uppercase;letter-spacing:.08em">Prochaine séance</p><h1 style="margin-top:4px">${esc(next.day.name)}</h1><p class="muted">${daySummary(next.day)}</p><div class="row"><button type="button" class="btn primary" data-act="day-start" data-id="${next.day.id}">Commencer</button><button type="button" class="btn" data-act="day-view" data-id="${next.day.id}">Voir le détail</button></div></div>`
      : ps.planned ? `<div class="card" style="margin-top:16px"><h3>Semaine bouclée</h3><p class="muted small" style="margin-top:4px">Toutes les séances prévues sont faites. Récupère bien, ou ajoute une séance bonus.</p></div>` : ''}
    ${(() => { const wa = weeklyAdvice(); return wa.length ? `<h2 class="sec">Tes conseils de la semaine</h2>
    <div class="list">${wa.map(w => `<div class="adv-row"><span class="t" style="font-weight:600">${esc(w.name)}${w.both ? ` <span class="chip" style="margin-left:4px">${PATTERNS[w.pat].short}</span>` : ''}</span><span class="verdict ${w.ad.cls}">${w.ad.kind}${w.target ? (w.pat === 'prog' ? ` · ${w.ad.delta > 0 ? '+' : '−'}${fmtN(Math.abs(w.ad.delta))} kg par série` : ` · ${fmtN(w.target)} kg`) : ''}</span><span class="d num">${fmtDate(w.last.date)} : ${esc(setsText(w.last.sets))} · ${esc(w.last.sets.map(x => x.feel ? FEELS[x.feel].toLowerCase() : '–').join(', '))}</span></div>`).join('')}</div>` : ''; })()}
    ${ps.planned ? `<h2 class="sec">Mon plan</h2>
    <div class="plan">${ps.rows.map(r => `<div class="plan-row ${r.done ? 'done' : ''} ${!draft && next && r.day.id === next.day.id ? 'next' : ''}">
      <span class="dot">${r.done ? '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>' : ''}</span>
      <div><div class="t">${esc(r.day.name)}</div><div class="d">${r.done ? `Fait ${fmtDate(r.done.date)} · ${fmtHM(effMinutes(r.done))}` : daySummary(r.day)}</div></div>
      ${r.done ? `<span class="chip good">Fait</span>` : `<button type="button" class="btn sm" data-act="day-start" data-id="${r.day.id}">Lancer</button>`}
    </div>`).join('')}</div>` : ''}
    ${ps.extra.length ? `<h2 class="sec">En plus cette semaine</h2><div class="list">${ps.extra.map(s => `<div class="item"><div><div class="t">${esc(s.name)}</div><div class="d">${fmtDate(s.date)} · ${fmtHM(effMinutes(s))}</div></div><span class="chip ${s.kind === 'cardio' ? 'cardio' : 'muscu'}">${s.kind === 'cardio' ? 'Cardio' : 'Muscu'}</span></div>`).join('')}</div>` : ''}
    <div class="row" style="margin-top:16px">
      <button type="button" class="btn" data-act="free-muscu">+ Séance muscu libre</button>
      <button type="button" class="btn" data-act="free-cardio">+ Cardio</button>
    </div>
    <div class="row" style="margin-top:18px"><button type="button" class="btn sm ghost" data-act="go" data-tab="profil">Mon profil et mon bilan</button></div>`;
}
function daySummary(d){
  if(d.kind === 'cardio') return `${CARDIO_TYPES[d.cardio?.type]?.label || 'Cardio'} · ${d.cardio?.minutes ? fmtHM(d.cardio.minutes) : '?'}`;
  const n = (d.exercises||[]).length;
  if(!n) return 'Aucun exercice pour l’instant';
  return `${n} exercice${n>1?'s':''} · ${esc(d.exercises.slice(0,3).map(e => e.name).join(', '))}${n>3?'…':''}`;
}

/* ---------- Programme ---------- */
function restSelect(id, val, attrs){
  const opts = REST_OPTS.includes(+val) ? REST_OPTS : [...REST_OPTS, +val].sort((a,b) => a-b);
  return `<select id="${id}" ${attrs}>${opts.map(s => `<option value="${s}" ${+val === s ? 'selected' : ''}>${s ? fmtRest(s) : 'Aucun'}</option>`).join('')}</select>`;
}
function methodGuide(open){
  return `<details class="card" ${open ? 'open' : ''}><summary>Guide des méthodes : répétitions, repos, tempo</summary>
    <p class="small muted" style="margin-top:8px">Le temps de repos et le nombre de répétitions changent la façon dont le muscle se développe. Chaque exercice de ton programme a son propre repos : c’est lui que le chrono lance quand tu valides une série.</p>
    <div class="methods" style="margin-top:8px">${Object.entries(METHODS).map(([k,m]) => `<div class="method">
      <b>${m.label}</b>
      <div class="facts"><span class="chip">${m.reps} répét.</span><span class="chip">Repos ${fmtRest(m.rest)}</span><span class="chip">${m.charge}</span><span class="chip">Tempo : ${m.tempo.toLowerCase()}</span></div>
      <p>${m.why}</p>
    </div>`).join('')}</div>
  </details>`;
}
function viewProgramme(){
  if(ui.gen?.status === 'running'){
    return `<div class="card gen"><div class="spinner" aria-hidden="true"></div><h3>L’IA prépare ton programme</h3>

  }
  const errBox = ui.gen?.status === 'error' ? `<div class="card stack" style="margin-bottom:14px">
      <p class="msg" style="margin:0">${({not_granted:'Tu n’as pas autorisé l’IA sur cette page.', rate_limited:'Trop de demandes pour le moment. Réessaie dans quelques minutes.', invalid_json:'La réponse de l’IA était incomplète.', refused:'L’IA n’a pas pu répondre à cette demande. Modifie tes précisions.'})[ui.gen.code] || 'La création a échoué.'}</p>
      <div class="row">${ui.gen.hide ? '' : `<button type="button" class="btn sm primary" data-act="prog-ia">Réessayer</button>`}<button type="button" class="btn sm" data-act="prog-local">Utiliser un programme type</button></div>
    </div>` : '';
  const P = journal.programme;
  if(!P){
    return `${errBox}<h1>Programme</h1><p class="lead">Deux façons de faire : tu saisis le tien, ou tu le fais créer d’après ton test.</p>
    <div class="choices" style="margin-top:16px">
      <button type="button" class="choice" data-act="prog-perso"><b>Saisir mon programme</b><span>Mes exos, mes séries, mes charges, mes temps de repos</span></button>
      <button type="button" class="choice" data-act="prog-ia"><b>Crée mon programme</b><span>${journal.profile?.goals?.length ? 'D’après mon bilan' : 'Je fais d’abord le bilan (5 min)'}</span></button>
    </div>
    <div style="margin-top:20px">${methodGuide(false)}</div>`;
  }
  const m = METHODS[P.method] || METHODS.hyper;
  const known = [...new Set([...COMMON_EX, ...journal.sessions.flatMap(s => (s.exercises||[]).map(e => e.name))])].sort((a,b) => a.localeCompare(b,'fr'));
  return `${errBox}<div class="prog-head">
      <label class="small muted" for="prog-name">Mon programme</label>
      <input id="prog-name" data-p="prog-name" value="${esc(P.name)}" autocomplete="off">
      <div class="row" style="gap:6px"><span class="chip ${P.source === 'ia' ? 'cardio' : 'muscu'}">${P.source === 'ia' ? 'Créé par l’IA' : P.source === 'auto' ? 'Créé d’après ton bilan' : 'Programme perso'}</span>${P.source !== 'perso' ? `<span class="chip">Méthode ${m.label.toLowerCase()}</span>` : ''}<span class="chip num">${P.days.length} séance${P.days.length>1?'s':''} / sem.</span></div>
      ${P.summary ? `<p class="small muted">${esc(P.summary)}</p>` : ''}
    </div>
    <div class="stack" style="margin-top:16px">
    ${P.days.map((d, di) => ui.editDay === d.id ? dayEditor(d, di, P.days.length) : dayCard(d)).join('')}
    </div>
    <datalist id="ex-list">${known.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="row" style="margin-top:14px">
      <button type="button" class="btn" data-act="day-add" data-kind="muscu">+ Jour muscu</button>
      <button type="button" class="btn" data-act="day-add" data-kind="cardio">+ Jour cardio</button>
    </div>
    <div style="margin-top:20px">${methodGuide(false)}</div>
    <h2 class="sec">Changer de programme</h2>
    <div class="row">
      ${journal.profile ? `<button type="button" class="btn sm" data-act="prog-ia">Me proposer un nouveau programme</button>` : ''}
      <button type="button" class="btn sm" data-act="test-start">Refaire le test</button>
      <button type="button" class="btn sm ${ui.confirmReset ? 'danger' : 'ghost'}" data-act="prog-reset">${ui.confirmReset ? 'Confirmer : repartir de zéro' : 'Repartir d’un programme vide'}</button>
    </div>`;
}
function dayCard(d){
  const head = `<header><div class="l"><h3>${esc(d.name)}</h3><span><span class="chip ${d.kind === 'cardio' ? 'cardio' : 'muscu'}">${d.kind === 'cardio' ? 'Cardio' : FOCUS[d.focus] || 'Muscu'}</span></span></div>
    <button type="button" class="btn sm" data-act="day-edit" data-id="${d.id}">Modifier</button></header>`;
  let body = '';
  if(d.kind === 'cardio'){
    body = `<div class="cardio-box"><b>${CARDIO_TYPES[d.cardio?.type]?.label || 'Cardio'}</b> · ${d.cardio?.minutes ? fmtHM(d.cardio.minutes) : '?'}${d.cardio?.format ? `<p class="small muted" style="margin-top:4px">${esc(d.cardio.format)}</p>` : ''}</div>`;
  }else{
    body = d.exercises.length ? `<div class="exs">${d.exercises.map(e => `<div class="exl">
        <span class="nm">${esc(e.name)}</span>
        <span class="spec num">${e.varied && e.perSet?.length ? `<b>${e.perSet.length} séries</b> : ${esc(planText(e.perSet))}` : `<b>${e.sets} × ${esc(e.reps)}</b>${e.kg !== '' && e.kg != null ? ` · ${fmtN(+e.kg)} kg` : ''}`} · repos <b>${fmtRest(e.rest)}</b>${e.tempo ? ` · ${esc(e.tempo)}` : ''}</span>

  }
  return `<article class="day">${head}${body}<footer><button type="button" class="btn sm primary" data-act="day-start" data-id="${d.id}">Lancer cette séance</button><button type="button" class="btn sm" data-act="day-dup" data-day="${d.id}">Dupliquer</button></footer></article>`;
}

        <button type="button" class="btn icon danger" data-act="ex-del" ${a} data-ex="${e.id}" aria-label="Supprimer l’exercice">✕</button>

      <label class="toggle"><input type="checkbox" id="de-same-${e.id}" data-p="ex" data-field="same" ${a} data-ex="${e.id}" ${e.varied ? '' : 'checked'}> Même charge à chaque série</label>

        <div class="ps-row head"><span>Série</span><span>Charge (kg)</span><span>Répét.</span></div>

          <input id="ps-reps-${e.id}-${k}" data-p="set" data-field="reps" data-i="${k}" ${a} data-ex="${e.id}" value="${esc(p.reps)}" placeholder="10" inputmode="numeric" aria-label="Répétitions série ${k+1}">

        <div class="row" style="gap:6px">

      </div>
      <div class="grid2"><label>Repos${restSelect('de-rest-'+e.id, e.rest, `data-p="ex" data-field="rest" ${a} data-ex="${e.id}"`)}</label><span></span></div>` : `<div class="grid4">
        <label>Séries<input id="de-sets-${e.id}" type="number" inputmode="numeric" min="1" max="10" data-p="ex" data-field="sets" ${a} data-ex="${e.id}" value="${esc(e.sets)}"></label>

        <label>Repos${restSelect('de-rest-'+e.id, e.rest, `data-p="ex" data-field="rest" ${a} data-ex="${e.id}"`)}</label>

      <div class="grid2">

      <button type="button" class="btn sm ${ui.confirmDel === 'day:'+d.id ? 'danger' : 'ghost'}" data-act="day-del" ${a}>${ui.confirmDel === 'day:'+d.id ? 'Confirmer la suppression' : 'Supprimer le jour'}</button>

}

/* ---------- Séance ---------- */
function delBtn(id){

function sessionItem(s, demo){
  let meta;
  if(s.kind === 'cardio'){
    const c = s.cardio || {};

function paceText(type, km, sec){
  if(!(km > 0) || !(sec > 0)) return '–';
  const u = CARDIO_TYPES[type]?.unit || 'km';
  if(u === 'km/h') return `${fmtN(km / (sec/3600))} km/h`;
  if(u === '100m') return `${fmtPace(sec / (km*10))} /100 m`;
  if(u === '500m') return `${fmtPace(sec / (km*2))} /500 m`;
  return `${fmtPace(sec / km)} /km`;
}

/* ---------- Progrès ---------- */
function viewProgres(){
  const j = shownSessions(), S = j.sessions;
  const now = new Date(), key = weekKey(now), wk = weekStats(S, key), ps = planStatus();
  const weeks = [];
  for(let i = 7; i >= 0; i--){ const d = weekStart(now); d.setDate(d.getDate() - i*7); const st = weekStats(S, weekKey(d)); weeks.push({d, k:weekKey(d), m:st.muscu, c:st.cardio}); }
  const maxV = Math.max(4, ...weeks.map(w => w.m + w.c));
  const W = 340, H = 170, L = 26, B = 24, T = 10, cw = (W - L - 6) / weeks.length, bw = cw * .56;
  const y = v => H - B - v/maxV*(H - B - T);
  const ticks = []; for(let v = 0; v <= maxV; v += maxV > 8 ? 4 : 2) ticks.push(v);
  const target = !j.demo && ps.planned ? `<line x1="${L}" x2="${W-4}" y1="${y(ps.planned)}" y2="${y(ps.planned)}" stroke="var(--ink-2)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-4}" y="${y(ps.planned)-4}" text-anchor="end" font-size="10" fill="var(--ink-2)">Objectif ${ps.planned}</text>` : '';
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances par semaine sur 8 semaines">
    ${ticks.map(v => `<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${v}</text>`).join('')}
    ${weeks.map((w,i) => {
      const x = L + i*cw + (cw-bw)/2, cur = w.k === key, ym = y(w.m), yc = y(w.m + w.c);
      return `${w.m ? `<rect x="${x}" y="${ym}" width="${bw}" height="${H-B-ym}" rx="2" fill="var(--chart-a)"/>` : ''}${w.c ? `<rect x="${x}" y="${yc}" width="${bw}" height="${ym-yc}" rx="2" fill="var(--chart-b)"/>` : ''}
        <text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-2)" font-weight="${cur?700:400}">${cur ? 'Cette sem.' : `${w.d.getDate()}/${w.d.getMonth()+1}`}</text>`;
    }).join('')}
    ${target}
  </svg>`;
  const best = {};
  S.forEach(s => (s.exercises||[]).forEach(e => e.sets.forEach(x => {
    if(!(+x.kg > 0)) return;
    const b = best[e.name];
    if(!b || x.kg > b.kg || (x.kg === b.kg && x.reps > b.reps)) best[e.name] = {kg:+x.kg, reps:+x.reps, date:s.date};
  })));
  const recs = Object.entries(best).sort((a,b) => b[1].kg - a[1].kg).slice(0,6);

/* ---------- Archive ---------- */
const exKey = n => String(n || '').trim().toLowerCase();
function exMetaOf(name){ return (journal.exMeta || {})[exKey(name)] || {}; }
function exerciseIndex(sessions){
  const idx = {};
  sessions.forEach(s => (s.exercises || []).forEach(e => {
    if(!e.sets?.length) return;
    const k = exKey(e.name);
    const it = idx[k] ||= {key:k, name:e.name, entries:[]};
    it.entries.push({date:s.date, sid:s.id, sets:e.sets, manual:!!s.manual, pat:patternOf(e.sets),
      max: Math.max(0, ...e.sets.map(x => +x.kg || 0)), vol: e.sets.reduce((a,x) => a + (+x.reps||0)*(+x.kg||0), 0)});
  }));
  Object.values(idx).forEach(it => { it.entries.sort((a,b) => String(a.date).localeCompare(String(b.date))); it.name = it.entries[it.entries.length-1] ? (sessions.flatMap(s => s.exercises||[]).find(e => exKey(e.name) === it.key)?.name || it.name) : it.name; });
  return idx;
}
function setsSummary(sets, perSide){
  const groups = [];
  sets.forEach(x => { const g = groups[groups.length-1]; const kg = +x.kg || 0; if(g && g.kg === kg){ g.n++; g.reps.push(+x.reps || 0); } else groups.push({kg, n:1, reps:[+x.reps || 0]}); });
  return groups.map(g => {
    const w = g.kg ? `<b>${fmtN(g.kg)} kg</b>${perSide ? ' / côté' : ''}` : '<b>Poids du corps</b>';
    const same = g.reps.every(r => r === g.reps[0]);
    const r = !g.reps[0] && same ? `${g.n} série${g.n>1?'s':''}` : same ? `${g.n} série${g.n>1?'s':''} de ${g.reps[0]}` : `${g.n} séries (${g.reps.join(', ')})`;
    return `${w} × ${r}`;
  }).join(' puis ');
}
const shortDate = iso => { const d = new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}`; };
function sparkline(vals){
  if(vals.length < 2) return '<svg viewBox="0 0 92 30" aria-hidden="true"></svg>';
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v,i) => [2 + i*(88/(vals.length-1)), 26 - (v-lo)/span*22]);
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 92 30" aria-hidden="true"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--chart-a)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--chart-a)"/></svg>`;
}
function niceStep(range){ const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))); return [1,2,2.5,5,10].map(m => m*p).find(x => x >= raw) || 10*p; }
function lineChart(series, unit){
  series = series.filter(sr => sr.pts.length);
  if(!series.length) return '';
  const W = 340, H = 200, L = 36, R = 14, T = 18, B = 26;
  const all = series.flatMap(sr => sr.pts);
  const times = all.map(p => new Date(p.date).getTime()), t0 = Math.min(...times), t1 = Math.max(...times);
  const vals = all.map(p => p.v), vmin = Math.min(...vals), vmax = Math.max(...vals);
  const step = niceStep(Math.max(vmax - vmin, vmax*0.2, 1));
  const lo = Math.max(0, Math.floor((vmin - step*0.5)/step)*step), hi = Math.ceil((vmax + step*0.3)/step)*step;
  const x = t => t1 === t0 ? (L + (W-R))/2 : L + (t - t0)/(t1 - t0)*(W - L - R);
  const y = v => T + (1 - (v - lo)/(hi - lo || 1))*(H - T - B);
  const ticks = []; for(let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v*100)/100);
  const one = series.length === 1;
  const body = series.map(sr => {
    const pts = sr.pts.map(p => [x(new Date(p.date).getTime()), y(p.v)]);
    const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
    const area = one && pts.length > 1 ? `<polygon points="${pts[0][0].toFixed(1)},${H-B} ${line} ${pts[pts.length-1][0].toFixed(1)},${H-B}" fill="var(--accent-soft)" opacity=".8"/>` : '';
    const lp = pts[pts.length-1];
    return `${area}<polyline points="${line}" fill="none" stroke="${sr.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length-1 ? 5 : 3.2}" fill="${i === pts.length-1 ? sr.color : 'var(--surface)'}" stroke="${sr.color}" stroke-width="2"/>`).join('')}
      <text x="${Math.min(lp[0], W-R-2)}" y="${Math.max(12, lp[1]-10)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${fmtN(sr.pts[sr.pts.length-1].v)} ${unit}</text>`;
  }).join('');
  const d0 = all.find(p => new Date(p.date).getTime() === t0).date, d1 = all.find(p => new Date(p.date).getTime() === t1).date;
  const xl = t1 === t0 ? [[x(t0), d0, 'middle']] : [[x(t0), d0, 'start'], [x(t1), d1, 'end']];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la charge">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${fmtN(v)}</text>`).join('')}
    ${body}
    ${xl.map(([xx, d, a]) => `<text x="${xx}" y="${H-8}" text-anchor="${a}" font-size="10" fill="var(--ink-2)">${shortDate(d).slice(0,5)}</text>`).join('')}
  </svg>
  ${one ? '' : `<div class="legend">${series.map(sr => `<span style="--c:${sr.color}">${sr.label}</span>`).join('')}</div>`}`;
}

        ${s.kind === 'cardio' ? `<p class="small muted num" style="margin-top:6px">${CARDIO_TYPES[s.cardio?.type]?.label || 'Cardio'} · ${fmtClock(s.cardio?.sec || 0)}${s.cardio?.km ? ` · ${fmtN(s.cardio.km)} km` : ''}${s.cardio?.note ? ` · ${esc(s.cardio.note)}` : ''}</p>` : ''}
        ${s.circuit ? `<p class="small muted num" style="margin-top:6px">${s.circuit.rounds} tours de ${s.circuit.work} s / ${s.circuit.rest} s</p>` : ''}
      </div>`).join('')}</div>`;
    }).join('')}`;
  }

  const q = exKey(ui.archQ);
  const items = Object.values(idx).filter(it => !q || it.key.includes(q)).sort((a,b) => String(b.entries[b.entries.length-1].date).localeCompare(String(a.entries[a.entries.length-1].date)));
  return `<h1>Suivi</h1>${seg}${demoNote}
    <input class="search" id="arch-q" type="search" placeholder="Chercher un exercice…" value="${esc(ui.archQ)}" style="margin-top:14px" aria-label="Chercher un exercice">
    <div class="list" style="margin-top:12px" id="arch-list">${items.length ? items.map(it => {
      const meta = exMetaOf(it.name), last = it.entries[it.entries.length-1], same = it.entries.filter(e => e.pat === last.pat), first = same.find(e => e.max > 0);
      const diff = first && last.max ? last.max - first.max : 0;
      return `<button type="button" class="exo-card" data-act="arch-open" data-k="${esc(it.key)}">
        <span class="nm">${esc(it.name)}${meta.setting ? ` <span class="chip">${esc(meta.setting)}</span>` : ''}</span>
        ${sparkline(same.filter(e => e.max > 0).map(e => e.max))}
        <span class="d num">${last.max ? `${fmtN(last.max)} kg${meta.perSide ? ' / côté' : ''}` : 'Poids du corps'} · ${shortDate(last.date)} · ${it.entries.length} séance${it.entries.length>1?'s':''}${diff > 0 ? ` · <b style="color:var(--good)">+${fmtN(diff)} kg</b>` : ''}</span>
      </button>`;
    }).join('') : '<div class="empty">Aucun exercice trouvé.</div>'}</div>
    <div style="margin-top:14px">${ui.archAdd ? addForm('') : `<button type="button" class="btn wide" data-act="arch-add-open">+ Ajouter une perf passée</button>`}</div>`;
}

/* ---------- Liste d'exercices ---------- */
const fold = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function pickerGroups(){
  const inCat = new Set(Object.values(CATALOG).flat().map(fold));
  const mine = [...new Set([...journal.sessions.flatMap(s => (s.exercises||[]).map(e => e.name)), ...(journal.programme?.days || []).flatMap(d => (d.exercises||[]).map(e => e.name))])]
    .filter(n => n && !inCat.has(fold(n))).sort((a,b) => a.localeCompare(b,'fr'));
  const g = mine.length ? {'Mes exercices': mine} : {};
  return Object.assign(g, CATALOG);
}
function openPicker(target, dayId){
  ui.picker = {target, dayId, q:'', cat:'Tous', added:{}};
  const box = $('#picker'); box.hidden = false; document.body.style.overflow = 'hidden';
  box.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter des exercices">
    <div class="sheet-head">
      <div class="top-line"><h3>Ajouter des exercices</h3><button type="button" class="btn primary sm" data-act="pk-close">Terminé</button></div>
      <input class="search" id="pk-q" type="search" placeholder="Chercher : hip thrust, fente…" autocomplete="off" aria-label="Chercher un exercice">
      <div class="cats" id="pk-cats"></div>
    </div>
    <div class="pk-list" id="pk-list"></div>
  </div>`;
  renderPicker();
}
function renderPicker(){
  const P = ui.picker; if(!P) return;
  const groups = pickerGroups(), q = fold(P.q);
  $('#pk-cats').innerHTML = ['Tous', ...Object.keys(groups)].map(c => `<button type="button" data-act="pk-cat" data-cat="${esc(c)}" aria-pressed="${P.cat === c}">${esc(c)}</button>`).join('');
  let html = '', any = false, exact = false;
  Object.entries(groups).forEach(([cat, names]) => {
    if(!q && P.cat !== 'Tous' && P.cat !== cat) return;
    const list = names.filter(n => !q || fold(n).includes(q));
    if(!list.length) return;
    any = true;
    if(list.some(n => fold(n) === q)) exact = true;
    html += `<div class="pk-group"><b>${esc(cat)}</b><div class="pk-rows">${list.map(n => {
      const c = P.added[fold(n)] || 0;
      return `<button type="button" class="pk-row ${c ? 'added' : ''}" data-act="pk-add" data-name="${esc(n)}"><span>${esc(n)}</span><span class="plus">${c ? (c > 1 ? '✓ ' + c : '✓') : '+'}</span></button>`;
    }).join('')}</div></div>`;
  });
  if(q && !exact){
    html = `<div class="pk-group"><div class="pk-rows"><button type="button" class="pk-row" data-act="pk-add" data-name="${esc(P.q.trim())}"><span>Créer « ${esc(P.q.trim())} »</span><span class="plus">+</span></button></div></div>` + html;
  }
  if(!any && !q) html = '<p class="small muted" style="padding:16px">Aucun exercice.</p>';
  $('#pk-list').innerHTML = html;
}
function pickerAdd(name){
  const P = ui.picker; if(!P || !name) return;
  if(P.target === 'draft'){
    if(!draft?.exercises) return;
    draft.exercises.push(exFromName(name)); saveDraft();
  }else{
    const d = findDay(P.dayId); if(!d) return;
    const m = METHODS[journal.programme.method] || METHODS.hyper;
    d.exercises.push({id:newId(), name, sets:m.sets, reps:TIMED.has(name) ? '45 s' : m.reps, kg:'', rest:m.rest, tempo:'', note:''});
    persistSoon();
  }
  P.added[fold(name)] = (P.added[fold(name)] || 0) + 1;
  const total = Object.values(P.added).reduce((a,b) => a+b, 0);
  toast(`${name} ajouté · ${total} au total`);
  renderPicker();
}
function closePicker(){
  if(!ui.picker) return;
  const added = Object.values(ui.picker.added).reduce((a,b) => a+b, 0);
  ui.picker = null; const box = $('#picker'); box.hidden = true; box.innerHTML = ''; document.body.style.overflow = '';
  if(added) persist();
