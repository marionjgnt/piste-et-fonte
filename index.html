<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ton carnet de muscu et de cardio : programme, séances, chrono, archive et courbes de progression.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piste &amp; Fonte">
<title>Piste &amp; Fonte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<meta name="theme-color" content="#F6F1FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1626" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F6F1FF; --blob1:#FFE0EA; --blob2:#DDEEFF; --blob3:#E3F7EC;
  --surface:#FFFFFF; --surface-2:#F1EBFC; --ink:#2A2140; --ink-2:#6E6585; --line:#E6DFF3;
  --accent:#C73E69; --accent-fill:#FFB5C9; --accent-ink:#3D1024; --accent-soft:#FFE6EE;
  --lane:#2C6BA3; --lane-fill:#A8D3F6; --lane-ink:#0F2F4D; --lane-soft:#E2F1FD;
  --good:#2C8A5C; --good-fill:#A9E8C7; --good-soft:#DDF6E8; --danger:#C0392B;
  --lilac:#CDBBF7; --lilac-soft:#EFE8FF; --peach:#FFD2B3; --peach-soft:#FFEEE2; --sun:#FFE7A1;
  --chart-a:#F2839F; --chart-b:#79B4E6;
  --shadow:0 2px 6px rgba(80,50,140,.06),0 10px 24px rgba(80,50,140,.07);
  --hero:linear-gradient(135deg,#FFD9C4 0%,#FFC4D6 45%,#D9C8FF 100%);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1A1626; --blob1:#3A2033; --blob2:#1C2B40; --blob3:#1C3329;
    --surface:#241F34; --surface-2:#2F2944; --ink:#F2EDFB; --ink-2:#B3AAC8; --line:#3A3352;
    --accent:#FF9DBA; --accent-fill:#F59AB6; --accent-ink:#2E0C1B; --accent-soft:#3D2436;
    --lane:#9CCBF3; --lane-fill:#8FC2EE; --lane-ink:#0C2338; --lane-soft:#1F3047;
    --good:#86DDB0; --good-fill:#7FD3A8; --good-soft:#1E3A2E; --danger:#FF9A8F;
    --lilac:#8E7AC9; --lilac-soft:#2E2745; --peach:#C98E6E; --peach-soft:#3A2A26; --sun:#8C7A3E;
    --chart-a:#F59AB6; --chart-b:#8FC2EE;
    --shadow:0 2px 8px rgba(0,0,0,.35);
    --hero:linear-gradient(135deg,#4A2E3F 0%,#46294A 45%,#352C5C 100%);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1A1626; --blob1:#3A2033; --blob2:#1C2B40; --blob3:#1C3329;
    --surface:#241F34; --surface-2:#2F2944; --ink:#F2EDFB; --ink-2:#B3AAC8; --line:#3A3352;
    --accent:#FF9DBA; --accent-fill:#F59AB6; --accent-ink:#2E0C1B; --accent-soft:#3D2436;
    --lane:#9CCBF3; --lane-fill:#8FC2EE; --lane-ink:#0C2338; --lane-soft:#1F3047;
    --good:#86DDB0; --good-fill:#7FD3A8; --good-soft:#1E3A2E; --danger:#FF9A8F;
    --lilac:#8E7AC9; --lilac-soft:#2E2745; --peach:#C98E6E; --peach-soft:#3A2A26; --sun:#8C7A3E;
    --chart-a:#F59AB6; --chart-b:#8FC2EE;
    --shadow:0 2px 8px rgba(0,0,0,.35);
    --hero:linear-gradient(135deg,#4A2E3F 0%,#46294A 45%,#352C5C 100%);
}
html{height:100%;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.update{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:40;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 10px 30px rgba(80,50,140,.25);width:max-content;max-width:calc(100% - 32px);font-weight:600;font-size:15px;border:2px solid var(--accent-fill)}
.update .btn{min-height:40px}
*{box-sizing:border-box}
body{background:radial-gradient(120% 60% at 0% 0%,var(--blob1),transparent 60%),radial-gradient(90% 50% at 100% 20%,var(--blob2),transparent 60%),radial-gradient(90% 60% at 30% 100%,var(--blob3),transparent 60%),var(--bg);background-attachment:fixed;min-height:100%;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:12px calc(100px + env(safe-area-inset-bottom,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.mark{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.status{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:inline-block}
.status.cloud i{background:var(--good)}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:34px;line-height:1.05;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h2.sec{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin:28px 0 10px}
h3{font-size:21px;font-weight:600}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.num{font-variant-numeric:tabular-nums}
.lead{margin-top:6px;color:var(--ink-2);max-width:48ch}

.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.lane{background:var(--lane-fill);border-color:var(--lane-fill);color:var(--lane-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);padding:0 10px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:14px}
.btn.icon{min-height:36px;width:36px;padding:0;border-radius:10px;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.hero{background:var(--hero);border-radius:24px;padding:20px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.35) 22px 26px);pointer-events:none}
.hero > *{position:relative;z-index:1}
.hero p{margin-top:8px;max-width:36ch}
.hero .row{margin-top:16px}
.hero .muted{color:var(--ink);opacity:.78}
.hero .btn:not(.primary){background:rgba(255,255,255,.55);border-color:transparent}
.hero .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}

.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.muscu{background:var(--accent-soft);color:var(--accent)}
.chip.cardio{background:var(--lane-soft);color:var(--lane)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.lilac{background:var(--lilac-soft);color:var(--ink)}
.chip.demo{border:1px dashed var(--line)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.item{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--ink-2)}
.item .meta{font-size:14px;color:var(--ink-2);grid-column:1/-1}
.item details{grid-column:1/-1;font-size:14px}
.item summary{cursor:pointer;color:var(--ink-2);font-size:13px;list-style:none}
.item summary::-webkit-details-marker{display:none}
.item summary::before{content:"▸ "}
.item details[open] summary::before{content:"▾ "}
.item ul{margin:6px 0 0;padding-left:18px}
.item .right{text-align:right}
.big-stat{font-family:var(--display);font-size:22px;font-weight:600}
.empty{padding:18px 16px;color:var(--ink-2);font-size:14px}

/* Semaine */
.week-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.meter{display:flex;gap:6px;margin-top:14px}
.meter span{flex:1;height:10px;border-radius:5px;background:var(--surface-2)}
.meter span.on{background:var(--chart-a)}
.meter span.on.c{background:var(--chart-b)}
.plan{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.plan-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:0}
.plan-row .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.plan-row.done .dot{background:var(--good-fill);border-color:var(--good-fill);color:var(--ink)}
.plan-row.next{background:var(--accent-soft)}
.plan-row .t{font-weight:600}
.plan-row .d{font-size:13px;color:var(--ink-2)}

/* Test */
.steps{display:flex;gap:6px;margin-block:4px 18px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.steps span.on{background:var(--chart-a)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:74px}
.choice b{font-size:17px}
.choice span{font-size:13px;color:var(--ink-2)}
.choice[aria-pressed="true"]{border-color:var(--chart-a);background:var(--accent-soft)}
.choices .choice:nth-child(3n+2)[aria-pressed="true"]{border-color:var(--lilac);background:var(--lilac-soft)}
.choices .choice:nth-child(3n)[aria-pressed="true"]{border-color:var(--peach);background:var(--peach-soft)}
.counter{display:grid;grid-template-columns:1fr auto 38px auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.counter:first-child{border-top:0}
.counter .n{font-family:var(--display);font-size:26px;font-weight:600;text-align:center}
.counter .sub{font-size:13px;color:var(--ink-2)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:15px}
.pill[aria-pressed="true"]{border-color:var(--lane-fill);background:var(--lane-fill);color:var(--lane-ink)}
.test-nav{display:flex;gap:10px;margin-top:20px}
.test-nav .btn.primary{flex:1}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;resize:vertical}

/* Programme */
.prog-head{display:flex;flex-direction:column;gap:8px}
.prog-head input{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;border:0;background:transparent;padding:0;width:100%;border-bottom:2px solid var(--line)}
.prog-head input:focus{outline:none;border-color:var(--accent)}
.day{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.day > header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 10px}
.day > header .l{display:flex;flex-direction:column;gap:4px;min-width:0}
.day .exs{display:flex;flex-direction:column}
.exl{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.exl .nm{font-weight:600}
.exl .spec{font-size:14px;color:var(--ink-2)}
.exl .spec b{color:var(--ink);font-weight:600}
.exl .nt{font-size:13px;color:var(--ink-2);font-style:italic}
.day footer{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.cardio-box{padding:10px 16px 14px;border-top:1px solid var(--line);font-size:15px}
.ed{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ed .top-row{display:flex;gap:6px;align-items:center}
.ed .top-row input{flex:1}
.ed input,.ed select,.field input,.field select,.add-ex input{min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%}
.ed .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.ed label.toggle{flex-direction:row;align-items:center;gap:10px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);min-height:40px}
.ps{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:14px;padding:10px}
.ps-row{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;align-items:center}
.ps-row.head{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);text-align:center}
.ps-row .n{font-family:var(--display);font-size:20px;font-weight:600;text-align:center;color:var(--ink-2)}
.ps-row input{text-align:center;background:var(--surface)!important}
.ps-step{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.ps-step input{width:70px!important;text-align:center;background:var(--surface)!important}
.ed label input,.ed label select,.ed label textarea{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
@media (max-width:400px){.ed .grid4{grid-template-columns:repeat(2,1fr)}.ed .grid2{grid-template-columns:1fr}}
.gen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;text-align:center}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.methods{display:flex;flex-direction:column;gap:0}
.method{padding:12px 16px;border-top:1px solid var(--line)}
.method:first-child{border-top:0}
.method .facts{display:flex;flex-wrap:wrap;gap:6px;margin-block:6px}
.method p{font-size:14px;color:var(--ink-2)}
details.card > summary{cursor:pointer;font-weight:600;list-style:none}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::after{content:" ▸";color:var(--ink-2)}
details.card[open] > summary::after{content:" ▾"}

/* Séance */
.draft-head{display:flex;flex-direction:column;gap:4px}
.draft-head input{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;border:0;background:transparent;padding:0;width:100%;border-bottom:2px solid var(--line)}
.draft-head input:focus{outline:none;border-color:var(--accent)}
.ex{background:var(--surface);border-radius:20px;padding:14px 14px 10px;box-shadow:var(--shadow)}
.ex header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex .target{font-size:14px;color:var(--ink-2);margin:2px 0 8px}
.ex .target b{color:var(--ink)}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;padding-block:4px}
.set-row.head{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);padding-block:0 2px;text-align:center}
.set-row .n{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;color:var(--ink-2)}
.set-row input{width:100%;min-width:0;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.set-row.done input{background:var(--good-soft);border-color:transparent}
.check{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{opacity:.35}
.set-row.done .check{background:var(--good-fill);border-color:var(--good-fill);color:var(--ink)}
.set-row.done .check svg{opacity:1}
.ex-foot{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:6px}
.ex-foot .hint{font-size:13px;color:var(--ink-2);margin-left:auto}
.add-ex{display:flex;gap:8px}
.add-ex input{height:46px;background:var(--surface);border-radius:12px}
.msg{font-size:14px;color:var(--danger)}
.planned{padding:12px 14px;border-radius:16px;background:var(--lane-soft);color:var(--ink);font-size:15px}
.planned b{color:var(--lane)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.rpe button[aria-pressed="true"]{background:var(--lane-fill);border-color:var(--lane-fill);color:var(--lane-ink)}

/* Chrono */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px 18px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
.dial .phase{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dial .phase.work{color:var(--accent)}
.dial .phase.rest{color:var(--lane)}
.dial .time{font-family:var(--display);font-size:clamp(72px,24vw,112px);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.dial .sub{font-size:15px;color:var(--ink-2);text-align:center;min-height:1.4em}
.bar{width:100%;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar b{display:block;height:100%;background:var(--chart-a);width:0;transition:width .2s linear}
.bar.rest b{background:var(--chart-b)}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets .btn{flex:1 1 70px}
.presets .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 90px;min-width:0}
.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.field input,.field select{height:46px;background:var(--surface);border-radius:12px}
.fields{display:flex;flex-wrap:wrap;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pace-out{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--lane-soft);color:var(--lane)}
.pace-out b{font-family:var(--display);font-size:26px;font-weight:600}

/* Progrès */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--peach-soft);border-radius:18px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tiles .tile:nth-child(2),.arch-stats .tile:nth-child(2){background:var(--lilac-soft)}
.tiles .tile:nth-child(3),.arch-stats .tile:nth-child(3){background:var(--good-soft)}
.arch-stats .tile:nth-child(4){background:var(--accent-soft)}
.tile .v small{font-size:16px;font-weight:500;color:var(--ink-2)}

<script>
(function(){

/* ================= Utilitaires ================= */

const LS = {

const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function fmtRest(sec){
  sec = +sec || 0;
  if(sec < 60) return `${sec} s`;
  const m = Math.floor(sec/60), s = sec%60;
  return s ? `${m} min ${String(s).padStart(2,'0')}` : `${m} min`;
}
function fmtDur(sec){
  const h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  return h ? `${h} h ${String(m).padStart(2,'0')}` : `${m} min`;
}
function fmtPace(secPerUnit){
  if(!isFinite(secPerUnit) || secPerUnit <= 0) return '–';
  let m = Math.floor(secPerUnit/60), s = Math.round(secPerUnit%60);
  if(s === 60){ m++; s = 0; }
  return `${m}′${String(s).padStart(2,'0')}″`;
}

  j = j && typeof j === 'object' ? j : {};

  return out;

let actx = null, wake = null;
function unlockAudio(){
  try{ if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state === 'suspended') actx.resume(); }catch(e){}
}
function beep(freq=880, dur=.15, vol=.25){
  if(!actx) return;
  try{
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

}
function restPause(){ if(!rest.running) return; rest.left = Math.max(0, (rest.endAt - performance.now())/1000); rest.running = false; releaseAwake(); }
function restStop(){ rest.running = false; rest.left = rest.total; releaseAwake(); updatePill(); }

function ivSetPhase(p){
  iv.phase = p; iv.phaseLen = p === 'prep' ? iv.prep : p === 'work' ? iv.work : p === 'rest' ? iv.rest : 0;
  iv.left = iv.phaseLen; iv.endAt = performance.now() + iv.left*1000; iv.lastSec = null;
}
function ivStart(){
  unlockAudio();
  if(iv.phase === 'idle' || iv.phase === 'done'){ iv.round = 1; ivSetPhase('prep'); } else iv.endAt = performance.now() + iv.left*1000;
  iv.running = true; keepAwake();
}
function ivPause(){ iv.left = Math.max(0, (iv.endAt - performance.now())/1000); iv.running = false; releaseAwake(); }
function ivReset(){ iv.running = false; iv.phase = 'idle'; iv.round = 0; iv.left = 0; releaseAwake(); }
function ivAdvance(){
  if(iv.phase === 'prep'){ ivSetPhase('work'); beep(1320,.35); buzz(300); return; }
  if(iv.phase === 'work'){
    if(iv.round >= iv.rounds){ iv.phase = 'done'; iv.running = false; beep(1320,.2); setTimeout(()=>beep(1320,.2),250); setTimeout(()=>beep(1760,.5),500); buzz([300,100,300,100,600]); releaseAwake(); if(tab === 'chrono') renderView(); return; }
    if(iv.rest > 0){ ivSetPhase('rest'); beep(660,.35); buzz(200); return; }
    iv.round++; ivSetPhase('work'); beep(1320,.35); buzz(300); return;
  }
  if(iv.phase === 'rest'){ iv.round++; ivSetPhase('work'); beep(1320,.35); buzz(300); }
}

function tick(){
  const now = performance.now();
  if(rest.running){
    rest.left = Math.max(0, (rest.endAt - now)/1000);
    const s = Math.ceil(rest.left);
    if(s !== rest.lastSec){ if(s <= 3 && s > 0) beep(880,.1); rest.lastSec = s; }
    if(rest.left <= 0){ rest.running = false; rest.left = rest.total; beep(1320,.2); setTimeout(()=>beep(1760,.4),220); buzz([200,100,400]); releaseAwake(); toast('Repos terminé : série suivante !'); if(tab === 'chrono' && chronoMode === 'repos') renderView(); }
  }
  if(iv.running){
    iv.left = Math.max(0, (iv.endAt - now)/1000);
    const s = Math.ceil(iv.left);
    if(s !== iv.lastSec){ if(s <= 3 && s > 0) beep(880,.1); iv.lastSec = s; }
    if(iv.left <= 0) ivAdvance();
  }
  updatePill(); updateDials();
}

function lastSetsFor(name){

const setsText = sets => sets.map(x => x.kg ? `${x.reps}×${fmtN(x.kg)}` : `${x.reps}`).join(', ');

function planStatus(){
  const days = journal.programme?.days || [];
  const wk = journal.sessions.filter(s => weekKey(s.date) === weekKey(new Date()));
  const used = new Set();
  const rows = days.map(d => { const s = wk.find(x => x.dayId === d.id && !used.has(x.id)); if(s) used.add(s.id); return {day:d, done:s || null}; });
  return {rows, extra: wk.filter(s => !used.has(s.id)), planned: days.length, done: rows.filter(r => r.done).length};
}

function dayName(focus, idx, count){ return count > 1 ? `${FOCUS[focus]} ${'ABCDEFG'[idx]}` : FOCUS[focus]; }
function skeletonDays(p){
  const days = [];
  FOCUS_ORDER.forEach(f => { const n = p.weekly[f] || 0; for(let i = 0; i < n; i++){
    days.push(f === 'cardio'
      ? {id:newId(), name:dayName(f,i,n), kind:'cardio', focus:f, cardio:{type:p.cardioTypes[i % (p.cardioTypes.length||1)] || 'tapis', minutes:Math.min(p.duration, 45), format:''}}
      : {id:newId(), name:dayName(f,i,n), kind:'muscu', focus:f, exercises:[]});
  }});
  return interleave(days);
}
function interleave(days){
  // Évite d'enchaîner deux fois le même type : A, cardio, B…
  const out = [], buckets = {};
  days.forEach(d => (buckets[d.focus] ||= []).push(d));
  let left = days.length, last = null;
  while(left){
    const keys = Object.keys(buckets).filter(k => buckets[k].length).sort((a,b) => buckets[b].length - buckets[a].length);
    const k = keys.find(k => k !== last) || keys[0];
    out.push(buckets[k].shift()); last = k; left--;
  }
  return out;
}
function cardioFormat(type, goal, minutes){
  const long = goal === 'endurance';
  return ({
    crossfit:`Échauffement 10 min, puis WOD en AMRAP ${Math.max(12, minutes-20)} min : 10 kettlebell swings, 10 box jumps, 10 burpees. Retour au calme 5 min.`,
    tapis: long ? `${minutes-5} min à allure confortable (tu peux parler), inclinaison 1 %.` : `Échauffement 8 min, puis 10 × (1 min rapide / 1 min marche rapide), inclinaison 2 %. 5 min de retour au calme.`,
    course: long ? `Footing de ${minutes-5} min en aisance respiratoire.` : `Échauffement 10 min, 8 × (30 s vite / 1 min 30 trot), 10 min de footing.`,
    velo:`${minutes} min à allure régulière, avec 5 × 2 min plus appuyé.`,
    rameur:`Échauffement 5 min, 6 × 500 m avec 1 min 30 de repos.`,
    natation:`200 m d’échauffement, 16 × 50 m (20 s de repos), 200 m souple.`,
    marche:`${minutes} min de marche rapide, en montée si possible.`,
    hiit:`Circuit ${Math.min(minutes,25)} min : 40 s d’effort / 20 s de repos (corde, burpees, mountain climbers).`,
    autre:'Séance libre.'
  })[type] || 'Séance libre.';
}
function localProgramme(p){
  const m = METHODS[GOALS[p.goal]?.method || 'hyper'];
  const nEx = p.duration <= 30 ? 4 : p.duration <= 45 ? 5 : p.duration <= 60 ? 6 : 7;
  const days = skeletonDays(p);
  const seen = {};
  days.forEach(d => {
    const i = seen[d.focus] = (seen[d.focus] ?? -1) + 1;
    if(d.kind === 'cardio'){ d.cardio.format = cardioFormat(d.cardio.type, p.goal, d.cardio.minutes); return; }
    const pool = POOL[d.focus][p.equipment] || POOL[d.focus].salle;
    const picks = []; for(let k = 0; k < Math.min(nEx, pool.length); k++) picks.push(pool[(k + i*2) % pool.length]);
    d.exercises = picks.map((name, k) => {
      const heavy = k === 0 && (m === METHODS.hyper);
      return {id:newId(), name, sets: heavy ? 4 : m.sets, reps: TIMED.has(name) ? '45 s' : heavy ? '6-8' : m.reps, kg:'', rest: heavy ? 150 : m.rest, tempo: m.tempo, note:''};
    });
  });

}
function normalizeProg(raw, p){
  if(!raw || !Array.isArray(raw.days) || !raw.days.length) throw {code:'invalid_json'};
  const method = METHODS[raw.method] ? raw.method : (GOALS[p.goal]?.method || 'hyper');
  const days = raw.days.slice(0, 10).map(d => {
    const kind = d.kind === 'cardio' ? 'cardio' : 'muscu';
    const focus = FOCUS[d.focus] ? d.focus : (kind === 'cardio' ? 'cardio' : 'full');
    const base = {id:newId(), name:String(d.name || FOCUS[focus]).slice(0,40), kind, focus};
    if(kind === 'cardio'){
      const c = d.cardio || {};
      base.cardio = {type: CARDIO_TYPES[c.type] ? c.type : 'autre', minutes: clampInt(c.minutes, 5, 240, 30), format: String(c.format || '').slice(0,400)};
    }else{
      base.exercises = (Array.isArray(d.exercises) ? d.exercises : []).slice(0, 12).map(e => ({
        id:newId(), name:String(e.name || 'Exercice').slice(0,60), sets:clampInt(e.sets, 1, 10, 3), reps:String(e.reps ?? '10').slice(0,12),
        kg:'', rest:clampInt(e.rest, 0, 600, METHODS[method].rest), tempo:String(e.tempo || '').slice(0,40), note:String(e.note || '').slice(0,160)
      }));
    }
    return base;
  });
  return {name:String(raw.name || 'Mon programme').slice(0,50), source:'ia', method, summary:String(raw.summary || '').slice(0,400), days, createdAt:new Date().toISOString()};
}
function aiPrompt(p){
  const weekly = FOCUS_ORDER.filter(f => p.weekly[f]).map(f => `${p.weekly[f]}× ${FOCUS[f]}`).join(', ');
  const m = METHODS[GOALS[p.goal].method];
  const nEx = p.duration <= 30 ? '4' : p.duration <= 45 ? '4 à 5' : p.duration <= 60 ? '5 à 6' : '6 à 7';
  return `Tu es coach en musculation et préparation physique. Crée le programme hebdomadaire de cette personne, en français.

PROFIL
- Objectif : ${GOALS[p.goal].label}

- Durée d'une séance : ${p.duration} min
- Matériel : ${EQUIP[p.equipment].label} (${EQUIP[p.equipment].sub})

RÈGLES

- Jours muscu : ${nEx} exercices faisables avec le matériel indiqué, polyarticulaires d'abord.

- Adapte le volume au niveau. Tiens compte des précisions (blessures, préférences).
- Jours cardio : choisis parmi les types aimés, et décris précisément la séance dans "format" (durées, intervalles, allure ou intensité).
- "reps" est un texte court : "8-10", "12", ou "45 s" pour un exercice en durée.

Réponds uniquement avec ce JSON :
{"name":"Nom court du programme","method":"force|hyper|endu|meta|puiss","summary":"2 phrases qui expliquent la logique du programme","days":[{"name":"Bas du corps A","kind":"muscu","focus":"bas|haut|full|push|pull","exercises":[{"name":"Squat barre","sets":4,"reps":"6-8","rest":150,"tempo":"3 s en descente","note":"Genoux dans l'axe des pieds"}]},{"name":"Cardio","kind":"cardio","focus":"cardio","cardio":{"type":"crossfit|tapis|course|velo|rameur|natation|marche|hiit|autre","minutes":30,"format":"…"}}]}`;

function finishTest(){
  const a = ui.test.a;

  if(mode === 'perso'){
    journal.programme = {name:'Mon programme', source:'perso', method:GOALS[a.goal].method, summary:'', days:skeletonDays(a), createdAt:new Date().toISOString()};

function sessionItem(s, demo){

  }else if(s.circuit){
    meta = `Circuit · ${s.circuit.rounds} tours de ${s.circuit.work} s / ${s.circuit.rest} s · ${s.durationMin} min`;
  }else{
    const nbEx = (s.exercises||[]).length, nbSets = (s.exercises||[]).reduce((a,e) => a + e.sets.length, 0), vol = volume(s);

function paceText(type, km, sec){
  if(!(km > 0) || !(sec > 0)) return '–';

  if(u === 'km/h') return `${fmtN(km / (sec/3600))} km/h`;
  if(u === '100m') return `${fmtPace(sec / (km*10))} /100 m`;
  if(u === '500m') return `${fmtPace(sec / (km*2))} /500 m`;
  return `${fmtPace(sec / km)} /km`;
}

/* ---------- Progrès ---------- */
function viewProgres(){
  const j = shownSessions(), S = j.sessions;
  const now = new Date(), key = weekKey(now), wk = weekStats(S, key), ps = planStatus();
  const weeks = [];
  for(let i = 7; i >= 0; i--){ const d = weekStart(now); d.setDate(d.getDate() - i*7); const st = weekStats(S, weekKey(d)); weeks.push({d, k:weekKey(d), m:st.muscu, c:st.cardio}); }
  const maxV = Math.max(4, ...weeks.map(w => w.m + w.c));
  const W = 340, H = 170, L = 26, B = 24, T = 10, cw = (W - L - 6) / weeks.length, bw = cw * .56;
  const y = v => H - B - v/maxV*(H - B - T);
  const ticks = []; for(let v = 0; v <= maxV; v += maxV > 8 ? 4 : 2) ticks.push(v);
  const target = !j.demo && ps.planned ? `<line x1="${L}" x2="${W-4}" y1="${y(ps.planned)}" y2="${y(ps.planned)}" stroke="var(--ink-2)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-4}" y="${y(ps.planned)-4}" text-anchor="end" font-size="10" fill="var(--ink-2)">Objectif ${ps.planned}</text>` : '';
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances par semaine sur 8 semaines">
    ${ticks.map(v => `<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${v}</text>`).join('')}
    ${weeks.map((w,i) => {
      const x = L + i*cw + (cw-bw)/2, cur = w.k === key, ym = y(w.m), yc = y(w.m + w.c);

/* ---------- Archive ---------- */
const exKey = n => String(n || '').trim().toLowerCase();
function exMetaOf(name){ return (journal.exMeta || {})[exKey(name)] || {}; }
function exerciseIndex(sessions){
  const idx = {};
  sessions.forEach(s => (s.exercises || []).forEach(e => {
    if(!e.sets?.length) return;
    const k = exKey(e.name);
    const it = idx[k] ||= {key:k, name:e.name, entries:[]};
    it.entries.push({date:s.date, sid:s.id, sets:e.sets, manual:!!s.manual,
      max: Math.max(0, ...e.sets.map(x => +x.kg || 0)), vol: e.sets.reduce((a,x) => a + (+x.reps||0)*(+x.kg||0), 0)});
  }));
  Object.values(idx).forEach(it => { it.entries.sort((a,b) => String(a.date).localeCompare(String(b.date))); it.name = it.entries[it.entries.length-1] ? (sessions.flatMap(s => s.exercises||[]).find(e => exKey(e.name) === it.key)?.name || it.name) : it.name; });
  return idx;
}
function setsSummary(sets, perSide){
  const groups = [];
  sets.forEach(x => { const g = groups[groups.length-1]; const kg = +x.kg || 0; if(g && g.kg === kg){ g.n++; g.reps.push(+x.reps || 0); } else groups.push({kg, n:1, reps:[+x.reps || 0]}); });
  return groups.map(g => {
    const w = g.kg ? `<b>${fmtN(g.kg)} kg</b>${perSide ? ' / côté' : ''}` : '<b>Poids du corps</b>';
    const same = g.reps.every(r => r === g.reps[0]);
    const r = !g.reps[0] && same ? `${g.n} série${g.n>1?'s':''}` : same ? `${g.n} série${g.n>1?'s':''} de ${g.reps[0]}` : `${g.n} séries (${g.reps.join(', ')})`;
    return `${w} × ${r}`;
  }).join(' puis ');
}
const shortDate = iso => { const d = new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}`; };
function sparkline(vals){
  if(vals.length < 2) return '<svg viewBox="0 0 92 30" aria-hidden="true"></svg>';
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = vals.map((v,i) => [2 + i*(88/(vals.length-1)), 26 - (v-lo)/span*22]);
  const last = pts[pts.length-1];
  return `<svg viewBox="0 0 92 30" aria-hidden="true"><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--chart-a)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--chart-a)"/></svg>`;
}
function niceStep(range){ const raw = range / 4, p = Math.pow(10, Math.floor(Math.log10(raw || 1))); return [1,2,2.5,5,10].map(m => m*p).find(x => x >= raw) || 10*p; }
function lineChart(points, unit){
  if(!points.length) return '';
  const W = 340, H = 200, L = 36, R = 14, T = 16, B = 26;
  const t0 = new Date(points[0].date).getTime(), t1 = new Date(points[points.length-1].date).getTime();
  const vals = points.map(p => p.v), vmin = Math.min(...vals), vmax = Math.max(...vals);
  const step = niceStep(Math.max(vmax - vmin, vmax*0.2, 1));
  const lo = Math.max(0, Math.floor((vmin - step*0.5)/step)*step), hi = Math.ceil((vmax + step*0.3)/step)*step;
  const x = t => t1 === t0 ? (L + (W-R))/2 : L + (t - t0)/(t1 - t0)*(W - L - R);
  const y = v => T + (1 - (v - lo)/(hi - lo || 1))*(H - T - B);
  const ticks = []; for(let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v*100)/100);
  const pts = points.map(p => [x(new Date(p.date).getTime()), y(p.v)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const area = pts.length > 1 ? `<polygon points="${pts[0][0].toFixed(1)},${H-B} ${line} ${pts[pts.length-1][0].toFixed(1)},${H-B}" fill="var(--accent-soft)" opacity=".8"/>` : '';
  const lastP = pts[pts.length-1];
  const mid = Math.floor((points.length-1)/2);
  const labelIdx = [...new Set([0, points.length-1])];
  if(pts[mid][0] - pts[0][0] > 60 && lastP[0] - pts[mid][0] > 60) labelIdx.splice(1, 0, mid);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution de la charge">
    ${ticks.map(v => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${fmtN(v)}</text>`).join('')}
    ${area}
    <polyline points="${line}" fill="none" stroke="var(--chart-a)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i === pts.length-1 ? 5 : 3.2}" fill="${i === pts.length-1 ? 'var(--chart-a)' : 'var(--surface)'}" stroke="var(--chart-a)" stroke-width="2"/>`).join('')}
    <text x="${Math.min(lastP[0], W-R-2)}" y="${Math.max(12, lastP[1]-10)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${fmtN(points[points.length-1].v)} ${unit}</text>
    ${labelIdx.map(i => `<text x="${pts[i][0]}" y="${H-8}" text-anchor="${i === 0 && pts.length > 1 ? 'start' : i === points.length-1 && pts.length > 1 ? 'end' : 'middle'}" font-size="10" fill="var(--ink-2)">${shortDate(points[i].date).slice(0,5)}</text>`).join('')}
  </svg>`;
}

        <span class="d num">${last.max ? `${fmtN(last.max)} kg${meta.perSide ? ' / côté' : ''}` : 'Poids du corps'} · ${shortDate(last.date)} · ${it.entries.length} séance${it.entries.length>1?'s':''}${diff > 0 ? ` · <b style="color:var(--good)">+${fmtN(diff)} kg</b>` : ''}</span>
      </button>`;
    }).join('') : '<div class="empty">Aucun exercice trouvé.</div>'}</div>
    <div style="margin-top:14px">${ui.archAdd ? addForm('') : `<button type="button" class="btn wide" data-act="arch-add-open">+ Ajouter une perf passée</button>`}</div>`;
}

/* ---------- Liste d'exercices ---------- */
const fold = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function pickerGroups(){
  const inCat = new Set(Object.values(CATALOG).flat().map(fold));
  const mine = [...new Set([...journal.sessions.flatMap(s => (s.exercises||[]).map(e => e.name)), ...(journal.programme?.days || []).flatMap(d => (d.exercises||[]).map(e => e.name))])]
    .filter(n => n && !inCat.has(fold(n))).sort((a,b) => a.localeCompare(b,'fr'));
  const g = mine.length ? {'Mes exercices': mine} : {};
  return Object.assign(g, CATALOG);
}
function openPicker(target, dayId){
  ui.picker = {target, dayId, q:'', cat:'Tous', added:{}};
  const box = $('#picker'); box.hidden = false; document.body.style.overflow = 'hidden';
  box.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Ajouter des exercices">
    <div class="sheet-head">
      <div class="top-line"><h3>Ajouter des exercices</h3><button type="button" class="btn primary sm" data-act="pk-close">Terminé</button></div>
      <input class="search" id="pk-q" type="search" placeholder="Chercher : hip thrust, fente…" autocomplete="off" aria-label="Chercher un exercice">
      <div class="cats" id="pk-cats"></div>
    </div>
    <div class="pk-list" id="pk-list"></div>
  </div>`;
  renderPicker();
}
function renderPicker(){
  const P = ui.picker; if(!P) return;
  const groups = pickerGroups(), q = fold(P.q);
  $('#pk-cats').innerHTML = ['Tous', ...Object.keys(groups)].map(c => `<button type="button" data-act="pk-cat" data-cat="${esc(c)}" aria-pressed="${P.cat === c}">${esc(c)}</button>`).join('');
  let html = '', any = false, exact = false;
  Object.entries(groups).forEach(([cat, names]) => {
    if(!q && P.cat !== 'Tous' && P.cat !== cat) return;
    const list = names.filter(n => !q || fold(n).includes(q));
    if(!list.length) return;
    any = true;
    if(list.some(n => fold(n) === q)) exact = true;
    html += `<div class="pk-group"><b>${esc(cat)}</b><div class="pk-rows">${list.map(n => {
      const c = P.added[fold(n)] || 0;
      return `<button type="button" class="pk-row ${c ? 'added' : ''}" data-act="pk-add" data-name="${esc(n)}"><span>${esc(n)}</span><span class="plus">${c ? (c > 1 ? '✓ ' + c : '✓') : '+'}</span></button>`;
    }).join('')}</div></div>`;
  });
  if(q && !exact){
    html = `<div class="pk-group"><div class="pk-rows"><button type="button" class="pk-row" data-act="pk-add" data-name="${esc(P.q.trim())}"><span>Créer « ${esc(P.q.trim())} »</span><span class="plus">+</span></button></div></div>` + html;
  }
  if(!any && !q) html = '<p class="small muted" style="padding:16px">Aucun exercice.</p>';
  $('#pk-list').innerHTML = html;
}
function pickerAdd(name){
  const P = ui.picker; if(!P || !name) return;
  if(P.target === 'draft'){
    if(!draft?.exercises) return;
    draft.exercises.push(exFromName(name)); saveDraft();
  }else{
    const d = findDay(P.dayId); if(!d) return;
    const m = METHODS[journal.programme.method] || METHODS.hyper;
    d.exercises.push({id:newId(), name, sets:m.sets, reps:TIMED.has(name) ? '45 s' : m.reps, kg:'', rest:m.rest, tempo:'', note:''});
    persistSoon();
  }
  P.added[fold(name)] = (P.added[fold(name)] || 0) + 1;
  const total = Object.values(P.added).reduce((a,b) => a+b, 0);
  toast(`${name} ajouté · ${total} au total`);
  renderPicker();
}
function closePicker(){
  if(!ui.picker) return;
  const added = Object.values(ui.picker.added).reduce((a,b) => a+b, 0);
  ui.picker = null; const box = $('#picker'); box.hidden = true; box.innerHTML = ''; document.body.style.overflow = '';
  if(added) persist();
  renderView();
}

/* ================= Actions ================= */
function findDay(id){ return journal.programme?.days.find(d => d.id === id); }
function startDraft(d){ draft = d; ui.confirmCancel = false; ui.msg = ''; saveDraft(); go('seance'); }
function startFromDay(day){
  if(draft){ toast('Termine ou abandonne ta séance en cours d’abord.'); go('seance'); return; }
  if(day.kind === 'cardio'){
    startDraft({kind:'cardio', dayId:day.id, name:day.name, startedAt:Date.now(), cardio:{type:day.cardio?.type || 'tapis', minutes:day.cardio?.minutes || '', format:day.cardio?.format || '', h:'', m:'', s:'', km:'', rpe:'', note:''}});
    return;
  }
  startDraft({kind:'muscu', dayId:day.id, name:day.name, startedAt:Date.now(), exercises: day.exercises.map(e => {
    const prev = lastSetsFor(e.name);
    const plan = e.varied && e.perSet?.length ? e.perSet : null;
    const timed = /s$/.test(String(e.reps).trim());
    const reps = timed ? '' : (parseInt(e.reps) || '');
    const n = plan ? plan.length : (e.sets || 3);
    const sets = Array.from({length:n}, (_, i) => {
      const pl = plan?.[i], pv = prev?.[Math.min(i, (prev?.length || 1) - 1)];
      const kg = pl && pl.kg !== '' && pl.kg != null ? pl.kg : (!plan && e.kg !== '' && e.kg != null ? e.kg : (pv ? pv.kg || '' : ''));
      return {reps: pl ? (parseInt(pl.reps) || '') : reps, kg, done:false};
    });
    return {name:e.name, rest:e.rest, target:{sets:n, reps:e.reps, plan, tempo:e.tempo, note:e.note}, sets};
  })});
}
function exFromName(name){
  const prev = lastSetsFor(name);
  const kg = prev ? prev[prev.length-1].kg || '' : '';
  return {name, rest:settings.rest, target:null, sets:Array.from({length:3}, () => ({reps:'', kg, done:false}))};
}
function ensureProgramme(){
  if(!journal.programme) journal.programme = {name:'Mon programme', source:'perso', method:GOALS[journal.profile?.goal]?.method || 'hyper', summary:'', days:[], createdAt:new Date().toISOString()};
  return journal.programme;
}

document.addEventListener('click', e => {
  const tb = e.target.closest('#tabs button');
  if(tb){ go(tb.dataset.tab); return; }
  const b = e.target.closest('[data-act]');
  if(!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const act = b.dataset.act, ex = +b.dataset.ex, st = +b.dataset.set;
  unlockAudio();
  switch(act){
    case 'go': go(b.dataset.tab); break;
    case 'more': ui.histMore += 20; renderView(); break;

    /* Test */
    case 'test-start': ui.test = newTest(); go('semaine'); break;
    case 't-set': { const k = b.dataset.k; ui.test.a[k] = b.dataset.num ? +b.dataset.v : b.dataset.v; renderView(); break; }
    case 't-count': { const w = ui.test.a.weekly; w[b.dataset.f] = Math.max(0, Math.min(7, (w[b.dataset.f]||0) + +b.dataset.d)); renderView(); break; }
    case 't-cardio': { const a = ui.test.a.cardioTypes, v = b.dataset.v, i = a.indexOf(v); i >= 0 ? a.splice(i,1) : a.push(v); renderView(); break; }
    case 't-back': ui.test.step--; renderView(); window.scrollTo(0,0); break;
    case 't-next': if(!testValid(ui.test)) break; if(ui.test.step < 4){ ui.test.step++; renderView(); window.scrollTo(0,0); } else finishTest(); break;
    case 't-quit': ui.test = null; renderView(); break;

    /* Programme */
    case 'prog-perso': {
      if(!journal.profile){ ui.test = newTest(); ui.test.a.mode = 'perso'; go('semaine'); break; }
      const P = ensureProgramme();
      if(!P.days.length){ P.days = skeletonDays(journal.profile); P.source = 'perso'; }
      ui.editDay = P.days.find(d => d.kind === 'muscu')?.id || P.days[0]?.id || null;
      persist(); go('programme'); break;
    }
    case 'prog-ia':
      if(!journal.profile){ ui.test = newTest(); ui.test.a.mode = 'ia'; go('semaine'); toast('Réponds d’abord au test'); break; }
      tab = 'programme'; LS.set('pf.tab', tab); generateAI(journal.profile); break;
    case 'prog-local': journal.programme = localProgramme(journal.profile); ui.gen = null; persist(); render(); toast('Programme type créé : modifie-le librement'); break;
    case 'gen-stop': ui.gen?.ctl?.abort(); break;
    case 'prog-reset':
      if(!ui.confirmReset){ ui.confirmReset = true; renderView(); break; }
      ui.confirmReset = false; journal.programme = {name:'Mon programme', source:'perso', method:GOALS[journal.profile?.goal]?.method || 'hyper', summary:'', days: journal.profile ? skeletonDays(journal.profile) : [], createdAt:new Date().toISOString()};
      ui.editDay = journal.programme.days[0]?.id || null; persist(); renderView(); break;
    case 'day-view': ui.editDay = null; go('programme'); setTimeout(() => document.getElementById('dn-' + b.dataset.id)?.scrollIntoView({block:'center'}), 50); break;
    case 'day-start': { const d = findDay(b.dataset.id); if(d) startFromDay(d); break; }
    case 'day-edit': ui.editDay = b.dataset.id; ui.confirmDel = null; renderView(); document.getElementById('dn-' + b.dataset.id)?.closest('.day')?.scrollIntoView({block:'start', behavior:'smooth'}); break;
    case 'day-done': ui.editDay = null; ui.confirmDel = null; persist(); renderView(); break;
    case 'day-add': {
      const P = ensureProgramme(), kind = b.dataset.kind;
      const d = kind === 'cardio'
        ? {id:newId(), name:'Cardio', kind:'cardio', focus:'cardio', cardio:{type:journal.profile?.cardioTypes?.[0] || 'tapis', minutes:30, format:''}}
        : {id:newId(), name:'Nouvelle séance', kind:'muscu', focus:'full', exercises:[]};
      P.days.push(d); ui.editDay = d.id; persist(); renderView();
      setTimeout(() => document.getElementById('dn-' + d.id)?.focus(), 30);
      break;
    }
    case 'day-move': { const P = journal.programme, i = P.days.findIndex(d => d.id === b.dataset.day), j = i + +b.dataset.d; if(j < 0 || j >= P.days.length) break; [P.days[i], P.days[j]] = [P.days[j], P.days[i]]; persistSoon(); renderView(); break; }
    case 'day-dup': {
      const P = journal.programme, i = P.days.findIndex(d => d.id === b.dataset.day); if(i < 0) break;
      const c = JSON.parse(JSON.stringify(P.days[i])); c.id = newId(); c.name = c.name + ' (copie)'; (c.exercises||[]).forEach(x => { x.id = newId(); });
      P.days.splice(i+1, 0, c); ui.editDay = c.id; persist(); renderView(); break;
    }
    case 'day-del':
      if(ui.confirmDel !== 'day:' + b.dataset.day){ ui.confirmDel = 'day:' + b.dataset.day; renderView(); break; }
      journal.programme.days = journal.programme.days.filter(d => d.id !== b.dataset.day); ui.confirmDel = null; ui.editDay = null; persist(); renderView(); toast('Jour supprimé'); break;
    case 'day-method': {
      const d = findDay(b.dataset.day), k = document.getElementById('dm-' + d.id)?.value, m = METHODS[k]; if(!d || !m) break;
      d.exercises.forEach(x => { x.sets = m.sets; if(!/s$/.test(String(x.reps).trim())) x.reps = m.reps; x.rest = m.rest; x.tempo = m.tempo; });
      persist(); renderView(); toast(`Méthode ${m.label.toLowerCase()} appliquée`); break;
    }
    case 'ps-add': case 'ps-del': case 'ps-fill': {
      const x = findDay(b.dataset.day)?.exercises.find(y => y.id === b.dataset.ex); if(!x?.perSet) break;
      if(act === 'ps-add'){ const last = x.perSet[x.perSet.length-1] || {kg:'', reps:''}; x.perSet.push({kg:last.kg, reps:last.reps}); }
      else if(act === 'ps-del'){ x.perSet.pop(); }
      else{
        const step = parseFloat(String(document.getElementById('ps-step-' + x.id)?.value || '').replace(',','.'));
        const base = parseFloat(String(x.perSet[0]?.kg ?? '').replace(',','.'));
        if(!isFinite(base)){ toast('Indique d’abord la charge de la série 1'); document.getElementById(`ps-kg-${x.id}-0`)?.focus(); break; }
        if(!isFinite(step)) break;
        x.perSet.forEach((p, k) => { p.kg = String(Math.round((base + k*step)*100)/100); });
        toast(`Charges : ${x.perSet.map(p => fmtN(+p.kg)).join(' → ')} kg`);
      }
      x.sets = x.perSet.length; persist(); renderView(); break;
    }
    case 'pk-open': openPicker(b.dataset.target, b.dataset.day); break;
    case 'pk-close': closePicker(); break;
    case 'pk-cat': ui.picker.cat = b.dataset.cat; renderPicker(); $('#pk-list').scrollTo(0,0); break;
    case 'pk-add': pickerAdd(b.dataset.name); break;
    case 'ex-new': {
      const d = findDay(b.dataset.day), inp = document.getElementById('add-ex-' + d.id), name = inp.value.trim();
      if(!name){ inp.focus(); break; }
      const m = METHODS[journal.programme.method] || METHODS.hyper;
      d.exercises.push({id:newId(), name, sets:m.sets, reps:TIMED.has(name) ? '45 s' : m.reps, kg:'', rest:m.rest, tempo:'', note:''});
      persist(); renderView(); document.getElementById('add-ex-' + d.id)?.focus(); break;
    }
    case 'ex-move': { const d = findDay(b.dataset.day), i = d.exercises.findIndex(x => x.id === b.dataset.ex), j = i + +b.dataset.d; if(j < 0 || j >= d.exercises.length) break; [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]]; persistSoon(); renderView(); break; }
    case 'ex-del': { const d = findDay(b.dataset.day); d.exercises = d.exercises.filter(x => x.id !== b.dataset.ex); persistSoon(); renderView(); break; }

    /* Séance */
    case 'free-muscu': if(draft){ go('seance'); break; } startDraft({kind:'muscu', dayId:null, name:'Séance du ' + new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'}), startedAt:Date.now(), exercises:[]}); break;
    case 'free-cardio': if(draft){ go('seance'); break; } startDraft({kind:'cardio', dayId:null, name:'Cardio', startedAt:Date.now(), cardio:{type:journal.profile?.cardioTypes?.[0] || 'tapis', minutes:'', format:'', h:'', m:'', s:'', km:'', rpe:'', note:''}}); break;
    case 'dx-add': { const inp = $('#new-ex'), name = inp.value.trim(); if(!name){ inp.focus(); break; } draft.exercises.push(exFromName(name)); saveDraft(); renderView(); break; }
    case 'dx-remove': draft.exercises.splice(ex,1); saveDraft(); renderView(); break;
    case 'set-add': { const sets = draft.exercises[ex].sets, last = sets[sets.length-1] || {reps:'',kg:''}; sets.push({reps:last.reps, kg:last.kg, done:false}); saveDraft(); renderView(); document.getElementById(`r-${ex}-${sets.length-1}`)?.focus(); break; }
    case 'set-del': draft.exercises[ex].sets.pop(); saveDraft(); renderView(); break;
    case 'set-done': {
      const E = draft.exercises[ex], s = E.sets[st];
      s.done = !s.done; saveDraft(); renderView();
      if(s.done && settings.autoRest){ const r = E.rest ?? settings.rest; if(r > 0) restStart(r); }
      break;
    }
    case 'finish': {
      const exercises = draft.exercises.map(e => ({name:e.name, sets:e.sets.filter(s => +s.reps > 0).map(s => ({reps:+s.reps, kg:+s.kg || 0}))})).filter(e => e.sets.length);
      if(!exercises.length){ ui.msg = 'Remplis au moins une série (nombre de répétitions) avant d’enregistrer.'; renderView(); break; }
      journal.sessions.unshift({id:newId(), date:new Date(draft.startedAt).toISOString(), kind:'muscu', dayId:draft.dayId || null, name:draft.name.trim() || 'Séance', durationMin:Math.max(1, Math.round((Date.now()-draft.startedAt)/60000)), exercises});
      draft = null; saveDraft(); restStop(); persist(); toast('Séance enregistrée'); go('semaine');
      break;
    }
    case 'finish-cardio': {
      const c = draft.cardio, sec = cardioSec(c), km = parseFloat(String(c.km).replace(',','.')) || 0;
      if(!(sec > 0)){ ui.msg = 'Indique la durée de ta séance.'; renderView(); break; }
      const out = {type:c.type, sec}; if(km > 0 && CARDIO_TYPES[c.type]?.unit) out.km = Math.round(km*100)/100; if(c.rpe) out.rpe = +c.rpe; if(c.note.trim()) out.note = c.note.trim().slice(0,300);
      journal.sessions.unshift({id:newId(), date:new Date(draft.startedAt).toISOString(), kind:'cardio', dayId:draft.dayId || null, name:draft.name.trim() || 'Cardio', durationMin:Math.max(1, Math.round(sec/60)), cardio:out});
      draft = null; saveDraft(); persist(); toast(`Séance enregistrée${out.km ? ' · ' + paceText(out.type, out.km, sec) : ''}`); go('semaine');
      break;
    }
    case 'rpe': draft.cardio.rpe = +b.dataset.v; saveDraft(); renderView(); break;
    case 'sw-go': sw.acc = 0; sw.laps = []; sw.start = performance.now(); sw.running = true; keepAwake(); chronoMode = 'sw'; LS.set('pf.chrono', chronoMode); go('chrono'); break;
    case 'sw-use': { const t = Math.floor(swNow()/1000); Object.assign(draft.cardio, {h: Math.floor(t/3600) || '', m: Math.floor(t%3600/60), s: t%60}); saveDraft(); renderView(); break; }
    case 'cancel':
      if(!ui.confirmCancel){ ui.confirmCancel = true; renderView(); break; }
      draft = null; saveDraft(); ui.confirmCancel = false; ui.msg = ''; render(); break;
    case 'del': ui.confirmDel = 's:' + b.dataset.id; renderView(); break;
    case 'del-confirm': journal.sessions = journal.sessions.filter(x => x.id !== b.dataset.id); ui.confirmDel = null; persist(); renderView(); toast('Séance supprimée'); break;

    /* Archive */
    case 'arch-mode': ui.archMode = b.dataset.mode; ui.archEx = null; ui.archAdd = false; renderView(); break;
    case 'arch-open': ui.archEx = b.dataset.k; ui.archAdd = false; ui.msg = ''; ui.confirmDel = null; renderView(); window.scrollTo(0,0); break;
    case 'arch-back': ui.archEx = null; ui.archAdd = false; ui.msg = ''; renderView(); break;
    case 'arch-metric': ui.archMetric = b.dataset.m; renderView(); break;
    case 'arch-add-open': ui.archAdd = true; ui.msg = ''; renderView(); document.getElementById('arch-add')?.scrollIntoView({block:'center'}); (document.getElementById('aa-name')?.value ? document.getElementById('aa-kg') : document.getElementById('aa-name'))?.focus(); break;
    case 'arch-add-close': ui.archAdd = false; ui.msg = ''; renderView(); break;
    case 'arch-save': {
      const name = $('#aa-name').value.trim(), dv = $('#aa-date').value, kg = parseFloat(String($('#aa-kg').value).replace(',','.')) || 0;
      const n = clampInt($('#aa-sets').value, 1, 10, 1), reps = clampInt($('#aa-reps').value, 0, 999, 0);
      if(!name || !dv){ ui.msg = 'Indique au moins l’exercice et la date.'; renderView(); break; }
      const iso = new Date(dv + 'T12:00:00').toISOString();
      const same = journal.sessions.find(x => x.manual && x.date.slice(0,10) === iso.slice(0,10));
      const sets = Array.from({length:n}, () => ({reps, kg}));
      if(same){ const e2 = same.exercises.find(e => exKey(e.name) === exKey(name)); e2 ? e2.sets.push(...sets) : same.exercises.push({name, sets}); }
      else { journal.sessions.push({id:newId(), date:iso, kind:'muscu', manual:true, dayId:null, name:'Saisie d’archive', durationMin:0, exercises:[{name, sets}]}); journal.sessions.sort((a,b) => String(b.date).localeCompare(String(a.date))); }
      ui.msg = ''; persist(); if(ui.archEx) ui.archEx = exKey(name); renderView();
      const k = $('#aa-kg'); if(k){ $('#aa-name').value = name; k.value = ''; k.focus(); }
      toast(`${shortDate(iso)} · ${name} ajouté`);
      break;
    }
    case 'arch-del': ui.confirmDel = 'ae:' + b.dataset.sid; renderView(); break;
    case 'arch-del-ok': {
      const s = journal.sessions.find(x => x.id === b.dataset.sid);
      if(s){ s.exercises = (s.exercises||[]).filter(e => exKey(e.name) !== ui.archEx); if(!s.exercises.length && s.kind !== 'cardio' && !s.circuit) journal.sessions = journal.sessions.filter(x => x !== s); }
      ui.confirmDel = null; persist(); if(!exerciseIndex(journal.sessions)[ui.archEx]) ui.archEx = null; renderView(); toast('Ligne supprimée');
      break;
    }

    /* Sauvegarde */
    case 'backup-export': {
      const blob = new Blob([JSON.stringify({app:'piste-et-fonte', exportedAt:new Date().toISOString(), journal}, null, 1)], {type:'application/json'});
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `piste-et-fonte-sauvegarde-${todayISO()}.json`; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Sauvegarde téléchargée'); break;
    }
    case 'backup-apply': journal = ui.pendingImport.data; ui.pendingImport = null; persist(); render(); toast('Sauvegarde importée'); break;
    case 'backup-cancel': ui.pendingImport = null; renderView(); break;

    /* Chrono */
    case 'mode': chronoMode = b.dataset.mode; LS.set('pf.chrono', chronoMode); renderView(); updatePill(); break;
    case 'rest-preset': { const s = +b.dataset.s, was = rest.running; rest.total = s; rest.left = s; rest.running = false; if(was) restStart(); renderView(); break; }
    case 'rest-toggle': rest.running ? restPause() : restStart(); renderView(); break;
    case 'rest-reset': restStop(); renderView(); break;
    case 'rest-plus':
      if(rest.running){ rest.endAt += 15000; rest.total = Math.max(rest.total, (rest.endAt - performance.now())/1000); }
      else { rest.left += 15; rest.total = Math.max(rest.total, rest.left); }
      tick(); break;
    case 'rest-skip': restStop(); break;
    case 'iv-toggle': iv.running ? ivPause() : ivStart(); renderView(); break;
    case 'iv-reset': ivReset(); renderView(); break;
    case 'iv-preset': Object.assign(iv, {work:+b.dataset.w, rest:+b.dataset.r, rounds:+b.dataset.n, names:[], title:''}); ivReset(); ivSave(); renderView(); break;
    case 'circuit': { const c = CIRCUITS.find(x => x.id === b.dataset.id); if(!c) break; Object.assign(iv, {work:c.work, rest:c.rest, rounds:c.rounds, names:c.ex.slice(), title:c.name}); ivReset(); ivSave(); renderView(); window.scrollTo(0,0); break; }
    case 'iv-log': {
      const total = iv.prep + iv.rounds*iv.work + Math.max(0,iv.rounds-1)*iv.rest;
      journal.sessions.unshift({id:newId(), date:new Date().toISOString(), kind:'muscu', dayId:null, name: iv.title || `Intervalles ${iv.work}/${iv.rest}`, durationMin:Math.max(1, Math.round(total/60)), circuit:{work:iv.work, rest:iv.rest, rounds:iv.rounds}, exercises:[]});
      ivReset(); persist(); renderView(); toast('Circuit ajouté à ton carnet'); break;
    }
    case 'sw-toggle':
      if(sw.running){ sw.acc = swNow(); sw.running = false; releaseAwake(); } else { sw.start = performance.now(); sw.running = true; keepAwake(); }
      renderView(); break;
    case 'sw-lap': { const t = swNow(), prev = sw.laps[0]?.total || 0; sw.laps.unshift({total:t, split:t-prev}); renderView(); break; }
    case 'sw-reset': sw.acc = 0; sw.running = false; sw.laps = []; releaseAwake(); renderView(); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f && draft?.exercises){
    const s = draft.exercises[+t.dataset.ex]?.sets[+t.dataset.set];
    if(s){ s[t.dataset.f] = t.value; saveDraft(); }
  }else if(t.id === 'draft-name' && draft){ draft.name = t.value; saveDraft(); }
  else if(t.dataset.c && draft?.cardio){ draft.cardio[t.dataset.c] = t.value; saveDraft(); updatePace(); }
  else if(t.dataset.tNotes !== undefined && ui.test){ ui.test.a.notes = t.value.slice(0,600); }
  else if(t.dataset.iv){
    iv[t.dataset.iv] = Math.max(t.dataset.iv === 'rest' ? 0 : 1, Math.round(+t.value || 0)); iv.names = []; iv.title = ''; ivSave(); updateDials();
  }
  else if(t.id === 'pk-q' && ui.picker){ ui.picker.q = t.value; renderPicker(); }
  else if(t.id === 'arch-q'){ ui.archQ = t.value; const pos = t.selectionStart; renderView(); const n = $('#arch-q'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  else if(t.dataset.meta === 'setting' && ui.archEx){ const k = ui.archEx; journal.exMeta[k] = Object.assign({}, journal.exMeta[k], {setting:t.value.slice(0,40)}); persistSoon(); }
  else if(t.dataset.p){
    const P = journal.programme; if(!P) return;
    const f = t.dataset.field;
    if(t.dataset.p === 'prog-name'){ P.name = t.value.slice(0,50); }
    else{
      const d = P.days.find(x => x.id === t.dataset.day); if(!d) return;
      if(t.dataset.p === 'day') d[f] = f === 'name' ? t.value.slice(0,40) : t.value;
      else if(t.dataset.p === 'cardio') d.cardio[f] = f === 'minutes' ? clampInt(t.value, 0, 600, '') : t.value.slice(0,400);
      else{
        const x = d.exercises.find(y => y.id === t.dataset.ex); if(!x) return;
        if(f === 'same') return;
        if(t.dataset.p === 'set'){ const ps = x.perSet?.[+t.dataset.i]; if(ps) ps[f] = f === 'kg' ? t.value : t.value.slice(0,12); persistSoon(); return; }
        x[f] = f === 'sets' ? clampInt(t.value, 1, 10, 1) : f === 'rest' ? clampInt(t.value, 0, 600, 0) : f === 'kg' ? t.value : t.value.slice(0, f === 'note' ? 160 : 60);
      }
    }
    persistSoon();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.act === 'auto-rest'){ settings.autoRest = t.checked; saveSettings(); }
  else if(t.dataset.act === 'rest-default'){ settings.rest = +t.value; saveSettings(); if(!rest.running){ rest.total = settings.rest; rest.left = settings.rest; } renderView(); }
  else if(t.dataset.iv) renderView();
  else if(t.dataset.c === 'type'){ draft.cardio.type = t.value; saveDraft(); renderView(); }
  else if(t.dataset.meta === 'perSide' && ui.archEx){ const k = ui.archEx; journal.exMeta[k] = Object.assign({}, journal.exMeta[k], {perSide:t.checked}); persist(); renderView(); }
  else if(t.id === 'backup-file' && t.files && t.files[0]){
    const f = t.files[0], rd = new FileReader();
    rd.onload = () => {
      try{
        const raw = JSON.parse(rd.result), j = migrate(raw.journal || raw);
        if(!Array.isArray(j.sessions)) throw 0;
        ui.pendingImport = {data:j, label: raw.exportedAt ? fmtDate(raw.exportedAt) : f.name};
      }catch(err){ toast('Ce fichier n’est pas une sauvegarde Piste & Fonte.'); }
      renderView();
    };
    rd.readAsText(f); t.value = '';
  }
  else if(t.dataset.p === 'ex' && t.dataset.field === 'same'){
    const x = findDay(t.dataset.day)?.exercises.find(y => y.id === t.dataset.ex);
    if(x){
      x.varied = !t.checked;
      if(x.varied){
        if(!x.perSet?.length) x.perSet = Array.from({length:x.sets || 3}, () => ({kg:x.kg ?? '', reps:String(parseInt(x.reps) || '')}));
        x.sets = x.perSet.length;
      }else if(x.perSet?.length){ x.sets = x.perSet.length; if(x.kg === '' || x.kg == null) x.kg = x.perSet[0].kg; }
      persist(); renderView();
      document.getElementById('de-same-' + x.id)?.closest('.ed')?.scrollIntoView({block:'nearest'});
    }
  }
  else if(t.dataset.p){ persist(); }
});
$('#picker').addEventListener('click', e => { if(e.target.id === 'picker') closePicker(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && ui.picker){ closePicker(); return; }
  if(e.key !== 'Enter') return;
  if(e.target.id === 'new-ex'){ e.preventDefault(); document.querySelector('[data-act="dx-add"]')?.click(); }
  else if(e.target.id?.startsWith('add-ex-')){ e.preventDefault(); e.target.nextElementSibling?.click(); }
});
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ if(persistT) persist(); }
  else if(rest.running || iv.running || sw.running){ wake = null; keepAwake(); }
});

render();
connect();
setupUpdates();
})();
</script>
</body>
</html>
